name: Bug report
description: Something on the site or in the build is broken
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page or route
      description: The URL where it happens, e.g. https://ocs.com.ua/ua/contact/
    validations:
      required: true
  - type: dropdown
    id: site
    attributes:
      label: Site
      options:
        - ocs.com.ua (prod)
        - dev.ocs.com.ua
        - Local build
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: e.g. Safari 19 on iPhone
