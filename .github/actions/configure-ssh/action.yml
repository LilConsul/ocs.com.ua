name: Configure SSH
description: Write the deploy SSH key and known_hosts to ~/.ssh

inputs:
  ssh-key:
    description: Private key (PEM/OpenSSH)
    required: true
  known-hosts:
    description: known_hosts content for the target server
    required: true

runs:
  using: composite
  steps:
    # The values come in through env, not ${{ }} inside the script, so the shell never parses them
    - name: Write SSH credentials
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        install -m 700 -d ~/.ssh
        (umask 077 && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519)
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
