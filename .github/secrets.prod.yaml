# Maps GitHub repository secrets/variables to the server env file of ocs.com.ua.
# All values are injected by the deploy workflow; this file contains no secrets.
# The rendered file is streamed over SSH to this path on the server (outside the releases so a
# deploy never removes it).
#
# Production reuses the dev site's reCAPTCHA keys (add ocs.com.ua to their allowed domains),
# datasheet signing secret and SMTP account. Only the GitHub OAuth app is its own: an app
# accepts callbacks for one host. CONTACT_TO is left out, so the default inbox
# (info@ocs.com.ua) receives the contact form.
env_file: /home/ocs/domains/ocs.com.ua/ocs-prod.env

secrets:
  # key: GitHub secret name  ->  value: env var name written to the env file
  PROD_GITHUB_CLIENT_ID: GITHUB_CLIENT_ID
  PROD_GITHUB_CLIENT_SECRET: GITHUB_CLIENT_SECRET
  DEV_RECAPTCHA_SECRET_KEY: RECAPTCHA_SECRET_KEY
  DEV_DATASHEET_TOKEN_SECRET: DATASHEET_TOKEN_SECRET
  SMTP_USER: SMTP_USER
  SMTP_PASS: SMTP_PASS

variables:
  # key: GitHub variable name  ->  value: env var name written to the env file
  DEV_RECAPTCHA_SITE_KEY: RECAPTCHA_SITE_KEY
  CONTACT_FROM: CONTACT_FROM
  SMTP_HOST: SMTP_HOST
  SMTP_PORT: SMTP_PORT
  SMTP_SECURE: SMTP_SECURE
