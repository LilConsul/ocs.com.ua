# Runs tests on pull requests.
# Pushes to main are covered by the test steps in deploy-dev.yml.
#
# Actions are pinned to commit SHAs (the tag is in the comment); Dependabot keeps them current.

name: CI

on:
  pull_request:
    paths:
      - "application/frontend/**"
      - "application/infra/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fe-unit-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: application/frontend/.bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('application/frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The pre-push hook runs this locally, but CMS commits and clones without hooks skip it
      - name: "[FE] Lint and format (Biome)"
        run: bun run ci

      - name: "[FE] Unit Tests"
        run: bun test

  # One job per browser, WebKit in two halves: WebKit on Linux runners is several times slower
  # than the other engines, so a single job spent most of its time waiting on it.
  fe-e2e-test:
    name: fe-e2e-test (${{ matrix.browser }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
          - browser: firefox
          - browser: webkit
            shard: 1/2
          - browser: webkit
            shard: 2/2
    defaults:
      run:
        working-directory: application/frontend
    env:
      # The env schema requires these at build time. The e2e checks never use them.
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
      SMTP_HOST: localhost
      RECAPTCHA_SECRET_KEY: ci
      DATASHEET_TOKEN_SECRET: ci-datasheet-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: application/frontend/.bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('application/frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Astro keeps every resized picture here and reuses it on the next build. Entries are named
      # by content, so a stale cache only holds unused files; the key changes with the pictures
      # and with bun.lock (the sharp version).
      - name: Restore Astro image cache
        id: astro-images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: application/frontend/node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('application/frontend/src/assets/**', 'application/frontend/bun.lock') }}
          restore-keys: astro-images-${{ runner.os }}-

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # One cache per browser, so each job downloads only the engine it runs
      - name: Cache Playwright browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: Install browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      # The browser comes from the cache, but its system libraries do not
      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps ${{ matrix.browser }}

      - name: Build
        run: bun run build

      # Only the first job saves it: the four jobs build the same pictures
      - name: Save Astro image cache
        if: matrix.browser == 'chromium' && steps.astro-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: application/frontend/node_modules/.astro/assets
          key: ${{ steps.astro-images.outputs.cache-primary-key }}

      - name: "[FE] E2E Tests"
        run: bun run test:e2e --project=${{ matrix.browser }} ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-test-results-${{ matrix.browser }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
          path: application/frontend/test-results
          retention-days: 7

  image-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            application/infra/uv.lock
            application/infra/pyproject.toml
            application/infra/scripts/check-images.py
      - name: "[FE] Images are real, small and not oversized"
        run: uv run application/infra/scripts/check-images.py

  infra-unit-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: application/infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            application/infra/uv.lock
            application/infra/pyproject.toml
            application/infra/scripts/check-images.py
      - name: "[Infra] Unit Tests"
        run: uv run pytest tests/ -v
