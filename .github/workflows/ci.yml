# Runs tests on pull requests.
# Pushes to main are covered by the test steps in deploy-dev.yml.

name: CI

on:
  pull_request:
    paths:
      - "application/frontend/**"
      - "application/infra/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fe-unit-test:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('application/frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - name: "[FE] Unit Tests"
        run: bun test

  fe-e2e-test:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: application/frontend
    env:
      # The env schema requires these at build time. The e2e checks never use them.
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
      SMTP_HOST: localhost
      RECAPTCHA_SECRET_KEY: ci
      DATASHEET_TOKEN_SECRET: ci-datasheet-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('application/frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Astro keeps every resized picture here and reuses it on the next build. Entries are named
      # by content, so a stale cache only holds unused files; the key changes with the pictures
      # and with bun.lock (the sharp version).
      - name: Restore Astro image cache
        id: astro-images
        uses: actions/cache/restore@v6
        with:
          path: application/frontend/node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('application/frontend/src/assets/**', 'application/frontend/bun.lock') }}
          restore-keys: astro-images-${{ runner.os }}-

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium firefox webkit

      # Browsers come from the cache, but their system libraries do not
      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium firefox webkit

      - name: Build
        run: bun run build

      - name: Save Astro image cache
        if: steps.astro-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: application/frontend/node_modules/.astro/assets
          key: ${{ steps.astro-images.outputs.cache-primary-key }}

      - name: "[FE] E2E Tests"
        run: bun run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: application/frontend/test-results
          retention-days: 7

  image-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            application/infra/uv.lock
            application/infra/pyproject.toml
            application/infra/scripts/check-images.py
      - name: "[FE] Images are real, small and not oversized"
        run: uv run application/infra/scripts/check-images.py

  infra-unit-test:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: application/infra
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            application/infra/uv.lock
            application/infra/pyproject.toml
            application/infra/scripts/check-images.py
      - name: "[Infra] Unit Tests"
        run: uv run pytest tests/ -v
