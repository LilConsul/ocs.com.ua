# Deploys a branch of your choice to https://dev.ocs.com.ua, to try changes on a real server
# before they reach main (which deploys to ocs.com.ua, see deploy-prod.yml).
#
# Run it from the Actions tab ("Run workflow", pick the branch) or with
#   gh workflow run deploy-dev.yml --ref <branch>

name: Deploy dev

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: dev
      site_url: https://dev.ocs.com.ua
      domain_dir: /home/ocs/domains/dev.ocs.com.ua
      service: ocs-dev
      port: 4321
      apache_conf: application/infra/apache/dev.ocs.com.ua.ocs.conf
      manifest: .github/secrets.dev.yaml
      # The dev site must never compete with ocs.com.ua in search or AI answers: robots.txt
      # blocks all, every page and file is noindex
      llms_indexing: false
      live: true
