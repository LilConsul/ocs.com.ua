# Builds the frontend on every push to main and deploys it to https://dev.ocs.com.ua.
# CMS publishes are commits to main too, so content edits go live the same way.
#
# Actions are pinned to commit SHAs (the tag is in the comment); Dependabot keeps them current.

name: Deploy dev

on:
  push:
    branches: [main]
    paths:
      - "application/frontend/**"
      - "application/infra/**"
      - ".github/workflows/deploy-dev.yml"
      - ".github/actions/**"
      # The map of secrets and variables rendered into the server env file
      - ".github/secrets.dev.yaml"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

# The jobs only read the repository; the server is reached over SSH, not with the GitHub token
permissions:
  contents: read

env:
  SSH_TARGET: ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}
  DOMAIN_DIR: /home/ocs/domains/dev.ocs.com.ua

jobs:
  # Runs next to the build instead of before it; deploy waits for both
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: application/frontend/.bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('application/frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bun run ci

      - name: Test
        run: bun test

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            application/infra/uv.lock
            application/infra/pyproject.toml
            application/infra/scripts/check-images.py
      - name: Test infra scripts
        working-directory: application/infra
        run: uv run pytest tests/ -v

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: application/frontend
    env:
      SITE_URL: https://dev.ocs.com.ua
      CMS_BASE_URL: https://dev.ocs.com.ua
      RECAPTCHA_SITE_KEY: ${{ vars.DEV_RECAPTCHA_SITE_KEY }}
      RECAPTCHA_SECRET_KEY: ${{ secrets.DEV_RECAPTCHA_SECRET_KEY }}
      DATASHEET_TOKEN_SECRET: ${{ secrets.DEV_DATASHEET_TOKEN_SECRET }}
      CONTACT_TO: ${{ vars.DEV_CONTACT_TO }}
      CONTACT_FROM: ${{ vars.CONTACT_FROM }}
      GITHUB_CLIENT_ID: ${{ secrets.DEV_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.DEV_GITHUB_CLIENT_SECRET }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SHOW_CLIENT_EQUIPMENT: ${{ vars.DEV_SHOW_CLIENT_EQUIPMENT }}
      SITE_DEV_NOTICE: ${{ vars.DEV_SITE_DEV_NOTICE }}
      # Fixed here, not a repository variable, so it cannot be switched on by mistake: the dev
      # site must never compete with ocs.com.ua in search or AI answers (robots.txt blocks all,
      # every page and file is noindex)
      LLMS_INDEXING: false
    steps:
      # Full commit history without file contents (cheap): the sitemap's <lastmod> comes from
      # the last commit touching each page's content, which a shallow clone cannot tell
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: application/frontend/.bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('application/frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Astro keeps every resized picture here and reuses it on the next build. Entries are named
      # by content, so a stale cache only holds unused files; the key changes with the pictures
      # and with bun.lock (the sharp version).
      - name: Restore Astro image cache
        id: astro-images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: application/frontend/node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('application/frontend/src/assets/**', 'application/frontend/bun.lock') }}
          restore-keys: astro-images-${{ runner.os }}-

      - name: Build
        run: bun run build

      - name: Save Astro image cache
        if: steps.astro-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: application/frontend/node_modules/.astro/assets
          key: ${{ steps.astro-images.outputs.cache-primary-key }}

      - name: Verify production server bundle
        run: |
          rm -rf node_modules
          node -e "
            import('./dist/server/entry.mjs')
              .then(() => process.exit(0))
              .catch((err) => {
                console.error('Failed to import server entry:', err);
                process.exit(1);
              });
          "

      # Hidden files are skipped by default; dist/client/.htaccess (ErrorDocument, charset) is one
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-build
          include-hidden-files: true
          path: |
            application/frontend/dist
            application/frontend/package.json
          retention-days: 1

  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [test, build]
    env:
      APP_DIR: /home/ocs/domains/dev.ocs.com.ua/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            application/infra/uv.lock
            application/infra/pyproject.toml
            application/infra/scripts/check-images.py

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          ssh-key: ${{ secrets.DEV_SSH_KEY }}
          known-hosts: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}

      # Atomically swap the Apache fragment, run configtest, reload on success,
      # or roll back to the previous file on failure — all in one SSH session.
      - name: Sync Apache config
        run: |
          rsync -az --no-owner --no-group \
            application/infra/apache/dev.ocs.com.ua.ocs.conf \
            "${SSH_TARGET}:${DOMAIN_DIR}/ocs-apache.conf.tmp"
          ssh "$SSH_TARGET" '
            set -euo pipefail
            CONF="/home/ocs/domains/dev.ocs.com.ua/ocs-apache.conf"
            cp "$CONF" "$CONF.bak"
            mv "$CONF.tmp" "$CONF"
            if sudo /usr/sbin/apache2ctl configtest 2>/dev/null; then
              rm -f "$CONF.bak"
              sudo /usr/bin/systemctl reload apache2
            else
              mv "$CONF.bak" "$CONF"
              rm -f "$CONF.tmp"
              sudo /usr/sbin/apache2ctl configtest
              exit 1
            fi
          '

      # Render the env file on the CI runner first, and only then stream it to the server.
      # Rendering to a file (not straight into a pipe) matters: a pipeline's exit status is
      # that of its last command, so a failed render would still let ssh replace the real env
      # file with an empty one. Here a render failure stops the job before the server is touched.
      - name: Sync env file
        env:
          GH_SECRETS: ${{ toJSON(secrets) }}
          GH_VARS: ${{ toJSON(vars) }}
        run: |
          umask 077
          ENV_FILE="$(mktemp)"
          uv run application/infra/scripts/render-env.py .github/secrets.dev.yaml > "$ENV_FILE"
          test -s "$ENV_FILE" || { echo "Rendered env file is empty, refusing to deploy it"; exit 1; }
          ssh "$SSH_TARGET" \
            "umask 077; cat > \"${DOMAIN_DIR}/ocs-dev.env.tmp\" && mv \"${DOMAIN_DIR}/ocs-dev.env.tmp\" \"${DOMAIN_DIR}/ocs-dev.env\"" \
            < "$ENV_FILE"
          rm -f "$ENV_FILE"

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-build
          path: application/frontend

      # Files are owned by the SSH user on the server; don't try to copy the runner's owner/group
      - name: Upload
        run: |
          rsync -az --delete --no-owner --no-group \
            application/frontend/dist \
            application/frontend/package.json \
            "${SSH_TARGET}:${APP_DIR}/"

      - name: Restart
        run: ssh "$SSH_TARGET" "sudo /usr/bin/systemctl restart ocs-dev"

      # Checks the Node server directly on the host, before Apache is involved.
      # `systemctl status` needs no sudo; journalctl tries a passwordless sudo first, then the
      # plain user (works when the user is in the adm / systemd-journal group).
      - name: Health check
        run: |
          ssh "$SSH_TARGET" '
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:4321/admin/config.yml > /dev/null 2>&1; then
                echo "Server is healthy and responding."
                exit 0
              fi
              echo "Waiting for server to start ($i/20)..."
              sleep 1
            done
            echo "Health check failed! Service status and logs:"
            systemctl status ocs-dev --no-pager || true
            sudo -n /usr/bin/journalctl -u ocs-dev -n 40 --no-pager 2>/dev/null \
              || journalctl -u ocs-dev -n 40 --no-pager \
              || echo "Cannot read the journal: add the user to the systemd-journal group (see docs/info/deployment.md)"
            exit 1
          '

  # Runs after the new build is live: checks the site through Apache on its public URL,
  # then runs the Playwright e2e suite against it.
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: deploy
    defaults:
      run:
        working-directory: application/frontend
    env:
      E2E_BASE_URL: https://dev.ocs.com.ua
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: application/frontend/.bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('application/frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Public health check
        working-directory: .
        run: |
          for path in /ua/ /en/ /admin/config.yml /robots.txt /llms.txt /llms-full.txt /ua/index.md /ua/about.md; do
            for i in $(seq 1 10); do
              if curl -fsS -o /dev/null "${E2E_BASE_URL}${path}"; then
                echo "OK ${path}"
                continue 2
              fi
              echo "Waiting for ${path} ($i/10)..."
              sleep 3
            done
            echo "Public health check failed for ${path}"
            exit 1
          done

      # AI tools read the Markdown page copies as text; a missing type would make them a download.
      # Hashed /_astro/ files must be cached for a year (public/.htaccess, needs mod_headers).
      - name: Headers of the LLM files and static assets
        working-directory: .
        run: |
          header() { curl -fsS -o /dev/null -D - "${E2E_BASE_URL}$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2-; }
          expect() {
            value=$(header "$1" "$2")
            echo "$1 $2: ${value:-<none>}"
            case "$value" in *"$3"*) ;; *) echo "Expected \"$3\""; exit 1 ;; esac
          }
          expect /llms.txt content-type text/plain
          expect /ua/about.md content-type text/markdown
          asset=$(curl -fsS "${E2E_BASE_URL}/ua/" | grep -o '/_astro/[^"]*\.css' | head -1)
          expect "$asset" cache-control immutable

      # Old WordPress addresses (src/data/legacy-redirects.json) must 301 to their new pages
      - name: Old WordPress addresses redirect
        working-directory: .
        run: |
          expect_redirect() {
            read -r code location < <(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "${E2E_BASE_URL}$1")
            echo "$1 -> $code $location"
            [ "$code" = "301" ] && [ "$location" = "${E2E_BASE_URL}$2" ] || { echo "Expected 301 to $2"; exit 1; }
          }
          expect_redirect /kontakty/ /ua/contact/
          expect_redirect /hc-a /ua/catalogue/equipment/checkweigher/hc-a/
          expect_redirect /category/x-ray-skanery/model-serii-sc-e/ /ua/catalogue/equipment/x-ray-inspection/

      # LLMS_INDEXING=false on dev: nothing may be indexed
      - name: Dev site is not indexable
        working-directory: .
        run: |
          robots=$(curl -fsS "${E2E_BASE_URL}/robots.txt")
          echo "$robots"
          echo "$robots" | grep -qx "Disallow: /" || { echo "robots.txt must disallow everything"; exit 1; }
          curl -fsS "${E2E_BASE_URL}/ua/" | grep -q '<meta name="robots" content="noindex, nofollow">' \
            || { echo "pages must carry noindex"; exit 1; }
          for path in /ua/ /ua/about.md /llms.txt; do
            tag=$(curl -fsS -o /dev/null -D - "${E2E_BASE_URL}${path}" | tr -d '\r' | grep -i '^x-robots-tag:' || true)
            echo "${path}: ${tag:-<none>}"
            echo "$tag" | grep -qi noindex || { echo "X-Robots-Tag noindex missing on ${path}"; exit 1; }
          done

      - run: bun install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: "[FE] E2E Tests (deployed dev site)"
        run: bun run test:e2e --project=chromium

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-test-results-dev
          path: application/frontend/test-results
          retention-days: 7
