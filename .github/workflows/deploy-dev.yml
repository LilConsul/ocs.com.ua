# Builds the frontend on every push to main and deploys it to https://dev.ocs.com.ua.
# CMS publishes are commits to main too, so content edits go live the same way.
#
# Repository secrets: DEV_SSH_HOST, DEV_SSH_USER, DEV_SSH_KEY, DEV_SSH_KNOWN_HOSTS
# Server layout and setup: see "Deployment" in README.md

name: Deploy dev

on:
  push:
    branches: [main]
    paths:
      - "application/frontend/**"
      - "application/infra/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # ── Job 1: test, build, upload artifact ─────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # A failing test stops the run before anything is built or uploaded
      - name: Test
        run: bun test

      - name: Test infra scripts
        working-directory: application/infra
        run: uv run pytest tests/ -v

      # Public astro:env values are inlined at build time; secrets are read at runtime on the server
      - name: Build
        run: bun run build
        env:
          SITE_URL: https://dev.ocs.com.ua
          CMS_BASE_URL: https://dev.ocs.com.ua
          RECAPTCHA_SITE_KEY: ${{ vars.DEV_RECAPTCHA_SITE_KEY }}
          CONTACT_TO: ${{ vars.DEV_CONTACT_TO }}
          CONTACT_FROM: ${{ vars.CONTACT_FROM }}

      # Install production-only deps before packaging — the server needs them at runtime
      - name: Install production dependencies
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile --production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            application/frontend/dist
            application/frontend/node_modules
            application/frontend/package.json
          retention-days: 1

  # ── Job 2: sync infra, upload app, restart ──────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      APP_DIR: /home/ocs/domains/dev.ocs.com.ua/app
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEV_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Atomically swap the Apache fragment, run configtest, reload on success,
      # or roll back to the previous file on failure — all in one SSH session.
      - name: Sync Apache config
        env:
          APACHE_CONF: /home/ocs/domains/dev.ocs.com.ua/ocs-apache.conf
        run: |
          rsync -az --no-owner --no-group \
            application/infra/apache/dev.ocs.com.ua.ocs.conf \
            "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}:${APACHE_CONF}.tmp"
          ssh "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}" bash -s << 'EOF'
            set -euo pipefail
            CONF="/home/ocs/domains/dev.ocs.com.ua/ocs-apache.conf"
            cp "$CONF" "$CONF.bak"
            mv "$CONF.tmp" "$CONF"
            if apache2ctl configtest 2>/dev/null; then
              rm -f "$CONF.bak"
              sudo /usr/bin/systemctl reload apache2
            else
              mv "$CONF.bak" "$CONF"
              rm -f "$CONF.tmp"
              apache2ctl configtest
              exit 1
            fi
          EOF

      # Render the env file on the CI runner and stream it to the server over SSH.
      # Writing via stdin + atomic rename means a render failure leaves the existing file intact.
      - name: Sync env file
        env:
          GH_SECRETS: ${{ toJSON(secrets) }}
          GH_VARS: ${{ toJSON(vars) }}
          ENV_FILE: /home/ocs/domains/dev.ocs.com.ua/ocs-dev.env
        run: |
          uv run application/infra/scripts/render-env.py .github/secrets.dev.yaml \
            | ssh "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}" \
              "umask 077; cat > \"${ENV_FILE}.tmp\" && mv \"${ENV_FILE}.tmp\" \"${ENV_FILE}\""

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: application/frontend

      # Files are owned by the SSH user on the server; don't try to copy the runner's owner/group
      - name: Upload
        run: |
          rsync -az --delete --no-owner --no-group \
            application/frontend/dist \
            application/frontend/node_modules \
            application/frontend/package.json \
            "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}:$APP_DIR/"

      - name: Restart
        run: ssh "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}" "sudo /usr/bin/systemctl restart ocs-dev"
