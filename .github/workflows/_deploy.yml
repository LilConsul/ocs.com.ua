# Shared build-and-deploy pipeline, called by deploy-prod.yml (ocs.com.ua) and deploy-dev.yml
# (dev.ocs.com.ua). Both sites run on the same server under the same user, so they share the
# SSH secrets; what differs comes in as inputs.
#
# Every deploy uploads a new release next to the previous ones and switches the `app` symlink to
# it, so a failed health check rolls back on its own and rollback.yml can go back by hand.

name: Deploy (shared)

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        type: string
        required: true
      site_url:
        type: string
        required: true
      domain_dir:
        description: Server directory holding releases/, app, the env file and the Apache fragment
        type: string
        required: true
      service:
        description: systemd unit running the Node server
        type: string
        required: true
      port:
        description: Port the Node server listens on (127.0.0.1)
        type: number
        required: true
      apache_conf:
        description: Apache proxy fragment in the repository
        type: string
        required: true
      manifest:
        description: Map of GitHub secrets/variables rendered into the server env file
        type: string
        required: true
      llms_indexing:
        description: Let search engines and AI crawlers index the build
        type: boolean
        required: true
      indexnow_key:
        description: IndexNow key (public, served as /<key>.txt); empty for no IndexNow
        type: string
        default: ""
      live:
        description: The public URL serves this deployment (false for prod until launch day)
        type: boolean
        required: true

permissions:
  contents: read

env:
  # The user name is a variable, not a secret: GitHub masks every secret value in the logs, and a
  # secret "ocs" turned every "ocs.com.ua" into "***.com.ua". The secret is a fallback until removed.
  SSH_TARGET: ${{ vars.SSH_USER || secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}
  DOMAIN_DIR: ${{ inputs.domain_dir }}
  SERVICE: ${{ inputs.service }}
  PORT: ${{ inputs.port }}
  # Releases kept on the server (the live one included) for rollback
  KEEP_RELEASES: 5

jobs:
  # Runs next to the build instead of before it; deploy waits for both
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: application/frontend/.bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('application/frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bun run ci

      - name: Test
        run: bun test

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            application/infra/uv.lock
            application/infra/pyproject.toml
            application/infra/scripts/check-images.py
      - name: Test infra scripts
        working-directory: application/infra
        run: uv run pytest tests/ -v

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: application/frontend
    env:
      SITE_URL: ${{ inputs.site_url }}
      CMS_BASE_URL: ${{ inputs.site_url }}
      LLMS_INDEXING: ${{ inputs.llms_indexing }}
      INDEXNOW_KEY: ${{ inputs.indexnow_key }}
      # The CMS commits to main, which is production: only ocs.com.ua/admin may edit content
      CMS_ENABLED: ${{ inputs.environment == 'prod' && 'true' || 'false' }}
      # reCAPTCHA, datasheet links and SMTP are shared by both sites
      RECAPTCHA_SITE_KEY: ${{ vars.DEV_RECAPTCHA_SITE_KEY }}
      RECAPTCHA_SECRET_KEY: ${{ secrets.DEV_RECAPTCHA_SECRET_KEY }}
      DATASHEET_TOKEN_SECRET: ${{ secrets.DEV_DATASHEET_TOKEN_SECRET }}
      CONTACT_FROM: ${{ vars.CONTACT_FROM }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      # One GitHub OAuth app per site: an app accepts callbacks for one host only
      GITHUB_CLIENT_ID: ${{ inputs.environment == 'prod' && secrets.PROD_GITHUB_CLIENT_ID || secrets.DEV_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ inputs.environment == 'prod' && secrets.PROD_GITHUB_CLIENT_SECRET || secrets.DEV_GITHUB_CLIENT_SECRET }}
      # Dev-only settings; empty means the default (production inbox, flags off)
      CONTACT_TO: ${{ inputs.environment == 'dev' && vars.DEV_CONTACT_TO || '' }}
      SHOW_CLIENT_EQUIPMENT: ${{ inputs.environment == 'dev' && vars.DEV_SHOW_CLIENT_EQUIPMENT || '' }}
      SITE_DEV_NOTICE: ${{ inputs.environment == 'dev' && vars.DEV_SITE_DEV_NOTICE || '' }}
    steps:
      # Full commit history without file contents (cheap): the sitemap's <lastmod> comes from
      # the last commit touching each page's content, which a shallow clone cannot tell
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: application/frontend/.bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('application/frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Astro keeps every resized picture here and reuses it on the next build. Entries are named
      # by content, so a stale cache only holds unused files; the key changes with the pictures
      # and with bun.lock (the sharp version).
      - name: Restore Astro image cache
        id: astro-images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: application/frontend/node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('application/frontend/src/assets/**', 'application/frontend/bun.lock') }}
          restore-keys: astro-images-${{ runner.os }}-

      - name: Build
        run: bun run build

      - name: Save Astro image cache
        if: steps.astro-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: application/frontend/node_modules/.astro/assets
          key: ${{ steps.astro-images.outputs.cache-primary-key }}

      - name: Verify production server bundle
        run: |
          rm -rf node_modules
          node -e "
            import('./dist/server/entry.mjs')
              .then(() => process.exit(0))
              .catch((err) => {
                console.error('Failed to import server entry:', err);
                process.exit(1);
              });
          "

      # Hidden files are skipped by default; dist/client/.htaccess (ErrorDocument, charset) is one
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-build-${{ inputs.environment }}
          include-hidden-files: true
          path: |
            application/frontend/dist
            application/frontend/package.json
          retention-days: 1

  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [test, build]
    # Listed under "Deployments" on the repository page: every deploy with its commit, status and
    # a link to the site, and which commit is live on each site
    environment:
      name: ${{ inputs.environment == 'prod' && 'production' || 'dev' }}
      url: ${{ inputs.site_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            application/infra/uv.lock
            application/infra/pyproject.toml
            application/infra/scripts/check-images.py

      # Render first: a missing secret or variable stops the job before the server is touched.
      # Rendering to a file (not straight into a pipe) matters: a pipeline's exit status is that
      # of its last command, so a failed render would still let ssh replace the real env file.
      - name: Render env file
        env:
          GH_SECRETS: ${{ toJSON(secrets) }}
          GH_VARS: ${{ toJSON(vars) }}
        run: |
          umask 077
          uv run application/infra/scripts/render-env.py "${{ inputs.manifest }}" > "$RUNNER_TEMP/site.env"
          test -s "$RUNNER_TEMP/site.env" || { echo "Rendered env file is empty, refusing to deploy it"; exit 1; }

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          ssh-key: ${{ secrets.DEV_SSH_KEY }}
          known-hosts: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}

      # Atomically swap the Apache fragment, run configtest, reload on success,
      # or roll back to the previous file on failure — all in one SSH session.
      - name: Sync Apache config
        run: |
          rsync -az --no-owner --no-group "${{ inputs.apache_conf }}" "${SSH_TARGET}:${DOMAIN_DIR}/ocs-apache.conf.tmp"
          ssh "$SSH_TARGET" "DOMAIN_DIR='${DOMAIN_DIR}' bash -s" <<'EOF'
            set -euo pipefail
            CONF="$DOMAIN_DIR/ocs-apache.conf"
            [ -f "$CONF" ] && cp "$CONF" "$CONF.bak" || : > "$CONF.bak"
            mv "$CONF.tmp" "$CONF"
            if sudo /usr/sbin/apache2ctl configtest 2>/dev/null; then
              rm -f "$CONF.bak"
              sudo /usr/bin/systemctl reload apache2
            else
              mv "$CONF.bak" "$CONF"
              sudo /usr/sbin/apache2ctl configtest
              exit 1
            fi
          EOF

      - name: Sync env file
        run: |
          ssh "$SSH_TARGET" \
            "umask 077; cat > \"${DOMAIN_DIR}/site.env.tmp\" && mv \"${DOMAIN_DIR}/site.env.tmp\" \"${DOMAIN_DIR}/${SERVICE}.env\"" \
            < "$RUNNER_TEMP/site.env"
          rm -f "$RUNNER_TEMP/site.env"

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-build-${{ inputs.environment }}
          path: application/frontend

      # A new directory per deploy. Unchanged files are hard links to the live release
      # (--link-dest), so the upload stays as small as a plain rsync.
      - name: Upload release
        id: release
        run: |
          RELEASE="${DOMAIN_DIR}/releases/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "dir=$RELEASE" >> "$GITHUB_OUTPUT"
          ssh "$SSH_TARGET" "DOMAIN_DIR='${DOMAIN_DIR}' bash -s" <<'EOF'
            set -euo pipefail
            mkdir -p "$DOMAIN_DIR/releases"
            # First deploy after the switch to releases: the old app/ directory becomes one
            if [ -d "$DOMAIN_DIR/app" ] && [ ! -L "$DOMAIN_DIR/app" ]; then
              mv "$DOMAIN_DIR/app" "$DOMAIN_DIR/releases/00000000-000000-initial"
              ln -s "$DOMAIN_DIR/releases/00000000-000000-initial" "$DOMAIN_DIR/app"
            fi
          EOF
          # What the release is, readable on the server (cat app/release.json) and by Rollback
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg deployed "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg message "$(git log -1 --format=%s)" \
            '{commit: $commit, ref: $ref, message: $message, deployed: $deployed, run: $run}' \
            > application/frontend/release.json
          # The very first deploy has no live release to hard-link against
          link=()
          ssh "$SSH_TARGET" "test -d '${DOMAIN_DIR}/app/'" && link=(--link-dest="${DOMAIN_DIR}/app/")
          rsync -az --delete --no-owner --no-group "${link[@]}" \
            application/frontend/dist \
            application/frontend/package.json \
            application/frontend/release.json \
            "${SSH_TARGET}:${RELEASE}/"

      # The symlink swap is atomic (mv -T); Apache serves the new files right away
      - name: Activate release
        run: |
          ssh "$SSH_TARGET" "DOMAIN_DIR='${DOMAIN_DIR}' RELEASE='${{ steps.release.outputs.dir }}' SERVICE='${SERVICE}' bash -s" <<'EOF'
            set -euo pipefail
            readlink "$DOMAIN_DIR/app" > "$DOMAIN_DIR/.previous-release" 2>/dev/null || : > "$DOMAIN_DIR/.previous-release"
            ln -sfn "$RELEASE" "$DOMAIN_DIR/app.new"
            mv -T "$DOMAIN_DIR/app.new" "$DOMAIN_DIR/app"
            sudo /usr/bin/systemctl restart "$SERVICE"
          EOF

      # Checks the Node server directly on the host, before Apache is involved. On failure the
      # previous release goes back live and the job fails.
      - name: Health check
        run: |
          ssh "$SSH_TARGET" "DOMAIN_DIR='${DOMAIN_DIR}' SERVICE='${SERVICE}' PORT='${PORT}' bash -s" <<'EOF'
            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${PORT}/admin/config.yml" > /dev/null 2>&1; then
                echo "Server is healthy and responding."
                exit 0
              fi
              echo "Waiting for server to start ($i/20)..."
              sleep 1
            done
            echo "Health check failed! Service status and logs:"
            systemctl status "$SERVICE" --no-pager || true
            sudo -n /usr/bin/journalctl -u "$SERVICE" -n 40 --no-pager 2>/dev/null \
              || journalctl -u "$SERVICE" -n 40 --no-pager \
              || echo "Cannot read the journal: add the user to the systemd-journal group (see docs/info/deployment.md)"
            PREVIOUS=$(cat "$DOMAIN_DIR/.previous-release" 2>/dev/null || true)
            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
              echo "Rolling back to $PREVIOUS"
              ln -sfn "$PREVIOUS" "$DOMAIN_DIR/app.new" && mv -T "$DOMAIN_DIR/app.new" "$DOMAIN_DIR/app"
              sudo /usr/bin/systemctl restart "$SERVICE"
            fi
            exit 1
          EOF

      # Keeps the newest releases (never the live one), then lists what is left in the run summary
      # (releases-summary.py), newest first with the live one marked; Rollback takes these names
      - name: Remove old releases
        run: |
          ssh "$SSH_TARGET" "DOMAIN_DIR='${DOMAIN_DIR}' KEEP='${KEEP_RELEASES}' bash -s" > "$RUNNER_TEMP/releases.tsv" <<'EOF'
            set -euo pipefail
            LIVE=$(readlink -f "$DOMAIN_DIR/app")
            ls -1d "$DOMAIN_DIR"/releases/*/ | sed 's#/$##' | sort -r | tail -n +$((KEEP + 1)) | while read -r old; do
              [ "$(readlink -f "$old")" = "$LIVE" ] || rm -rf "$old"
            done
            # One line per release: name, "live" or "-", release.json on one line (if any)
            ls -1d "$DOMAIN_DIR"/releases/*/ | sed 's#/$##' | sort -r | while read -r dir; do
              live="-"
              [ "$(readlink -f "$dir")" = "$LIVE" ] && live="live"
              info=""
              [ -f "$dir/release.json" ] && info=$(tr -d '\n' < "$dir/release.json")
              printf '%s\t%s\t%s\n' "$(basename "$dir")" "$live" "$info"
            done
          EOF
          uv run application/infra/scripts/releases-summary.py "${{ inputs.site_url }}" \
            --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" < "$RUNNER_TEMP/releases.tsv" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Before launch day the production build runs on the server but ocs.com.ua still serves
  # WordPress, so it can only be checked from inside the server
  verify-staged:
    if: ${{ !inputs.live }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          ssh-key: ${{ secrets.DEV_SSH_KEY }}
          known-hosts: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
      - name: Built site and Node server are in place
        run: |
          ssh "$SSH_TARGET" "DOMAIN_DIR='${DOMAIN_DIR}' PORT='${PORT}' bash -s" <<'EOF'
            set -euo pipefail
            for f in ua/index.html llms.txt robots.txt sitemap-index.xml .htaccess; do
              test -s "$DOMAIN_DIR/app/dist/client/$f" || { echo "missing $f"; exit 1; }
            done
            grep -q "^Sitemap:" "$DOMAIN_DIR/app/dist/client/robots.txt"
            curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/admin/config.yml"
            echo "Staged release $(readlink "$DOMAIN_DIR/app") is ready; ocs.com.ua still serves WordPress."
          EOF

  # Runs after the new build is live: checks the site through Apache on its public URL,
  # then runs the Playwright e2e suite against it.
  verify:
    if: ${{ inputs.live }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: deploy
    defaults:
      run:
        working-directory: application/frontend
    env:
      E2E_BASE_URL: ${{ inputs.site_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: application/frontend/.bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('application/frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            application/infra/uv.lock
            application/infra/pyproject.toml
            application/infra/scripts/check-images.py

      # Pages and LLM files answer, headers from public/.htaccess, old WordPress and http/www
      # redirects, indexing matching the build, and no CMS on dev. Details in the script.
      - name: Live site checks
        working-directory: .
        run: >-
          uv run application/infra/scripts/verify-site.py "${E2E_BASE_URL}"
          --environment "${{ inputs.environment }}"
          --indexing "${{ inputs.llms_indexing }}"

      - run: bun install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # One retry: over the internet a single network hiccup should not fail a deploy that is
      # already live. A real bug fails twice; Playwright reports a pass on retry as "flaky".
      # Pull request CI runs without retries, so tests that are flaky on their own still show.
      - name: "[FE] E2E Tests (deployed site)"
        run: bun run test:e2e --project=chromium --retries=1

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-test-results-${{ inputs.environment }}
          path: application/frontend/test-results
          retention-days: 7

  # Tells Bing (and through it ChatGPT search and Copilot) which pages changed in this push
  indexnow:
    if: ${{ inputs.live && inputs.llms_indexing && inputs.indexnow_key != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Pages whose <lastmod> is newer than the commit before this push; all pages otherwise
      - name: Submit changed pages
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          since=()
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            date=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BEFORE}" --jq .commit.committer.date) && since=(--since "$date")
          fi
          uv run application/infra/scripts/indexnow.py "${{ inputs.site_url }}" --key "${{ inputs.indexnow_key }}" "${since[@]}"
