# Keeps GitHub Actions, frontend dependencies, and Python infra dependencies up to date
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: bun
    directory: "/application/frontend"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # `astro check` does not support TypeScript 7 yet.
      # REVISIT by 2027-02-23 (the README badge and package.json are on TypeScript 6): check whether
      # @astrojs/check and astro support TypeScript 7, then remove this ignore and bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: uv
    directory: "/application/infra"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: deps
      include: scope
