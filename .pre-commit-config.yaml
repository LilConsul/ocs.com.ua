# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

# Content Markdown is formatted by remark (same as Decap CMS writes it), not by the generic hooks
x-exclude-content-md: &exclude-content-md ^application/frontend/src/content/.*\.md$

# Patch files are generated by `bun patch`; a blank context line is a single space, so trimming corrupts them
x-exclude-whitespace-sensitive: &exclude-whitespace-sensitive ^application/frontend/src/content/.*\.md$|\.patch$

# Mojibake signatures, matched on raw UTF-8 bytes (pygrep is bytes-based, so no non-ASCII char classes):
#   \xc3\xa2 / \xc3\x82 / \xc3\x83  = "â" / "Â" / "Ã" followed by a non-alphanumeric byte (UTF-8 read as cp1252)
#   \xef\xbf\xbd                    = U+FFFD replacement character (data already lost)
#   \xd0\xb2\xd0\x82                = "вЂ" (UTF-8 punctuation read as cp1251)
x-mojibake-pattern: &mojibake-pattern '(\xc3\xa2|\xc3\x82|\xc3\x83)[^a-zA-Z0-9\s]|\xef\xbf\xbd|\xd0\xb2\xd0\x82'

repos:
  # Standard pre-commit hooks for file quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: "[ALL] Trim trailing whitespace"
        exclude: *exclude-whitespace-sensitive
      - id: end-of-file-fixer
        name: "[ALL] Fix end of files (ensure newline)"
        exclude: *exclude-whitespace-sensitive
      - id: check-yaml
        name: "[ALL] Check YAML syntax"
      - id: check-json
        name: "[ALL] Check JSON syntax"
      - id: check-merge-conflict
        name: "[ALL] Check for merge conflicts"
      - id: mixed-line-ending
        name: "[ALL] Fix mixed line endings"
        args: ['--fix=lf']

  # Markdown formatting
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        name: "[DOCS] Format Markdown files"
        additional_dependencies:
          - mdformat-gfm     # GitHub Flavored Markdown
          - mdformat-tables  # Better table formatting
        exclude: *exclude-content-md

  # Ruff for the Python infra tooling (config in application/infra/pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        name: "[INFRA] Ruff Check"
        args: [--fix]
        files: ^application/infra/.*\.py$
      - id: ruff-format
        name: "[INFRA] Ruff Format"
        files: ^application/infra/.*\.py$

  # Local hooks for frontend (Biome, Prettier)
  - repo: local
    hooks:
      # Catches text saved with the wrong encoding, e.g. "—" becoming "â€”" or "─" becoming "â”€"
      - id: check-mojibake
        name: "[ALL] Check for garbled (mojibake) text"
        entry: *mojibake-pattern
        language: pygrep
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$|^application/frontend/bun\.lock$|\.patch$

      - id: i18n-frontend
        name: "[FE] i18n Extract & Compile"
        entry: bun
        args: ["--cwd", "application/frontend", "run", "i18n"]
        language: system
        pass_filenames: false
        files: ^application/frontend/(src/|locales/)

      - id: biome-check-frontend
        name: "[FE] Biome Check"
        entry: bun
        args: ["--cwd", "application/frontend", "run", "check:fix"]
        language: system
        types: [javascript, jsx, ts, tsx, json, css]
        pass_filenames: false
        files: ^application/frontend/

      - id: remark-content-frontend
        name: "[FE] Remark format Decap content (Markdown)"
        entry: bun
        args: ["run", "--cwd", "application/frontend", "remark:write"]
        language: system
        pass_filenames: false
        files: ^application/frontend/src/content/.*\.md$

      # Re-encodes mislabeled (e.g. PNG data in .webp) or oversized images in place.
      # pre-commit fails the commit when a hook modifies files, so re-stage and commit again.
      - id: optimize-public-images
        name: "[FE] Optimize images"
        entry: uv
        args: ["run", "application/infra/scripts/check-images.py", "--fix"]
        language: system
        files: ^application/frontend/(public|src/assets)/.*\.(webp|png|jpe?g)$

      - id: biome-ci-frontend
        name: "[FE] Biome CI"
        entry: bun
        args: ["--cwd", "application/frontend", "run", "ci"]
        language: system
        types: [javascript, jsx, ts, tsx, json, css]
        pass_filenames: false
        files: ^application/frontend/
        stages: [pre-push]
