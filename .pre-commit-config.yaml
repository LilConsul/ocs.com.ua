# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Standard pre-commit hooks for file quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: "[ALL] Trim trailing whitespace"
      - id: end-of-file-fixer
        name: "[ALL] Fix end of files (ensure newline)"
      - id: check-yaml
        name: "[ALL] Check YAML syntax"
      - id: check-json
        name: "[ALL] Check JSON syntax"
      - id: check-merge-conflict
        name: "[ALL] Check for merge conflicts"
      - id: mixed-line-ending
        name: "[ALL] Fix mixed line endings"
        args: ['--fix=lf']

  # Markdown formatting
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        name: "[DOCS] Format Markdown files"
        additional_dependencies:
          - mdformat-gfm     # GitHub Flavored Markdown
          - mdformat-tables  # Better table formatting

  # Ruff for Python backend code
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff
        name: "[BE] Ruff Check"
        args: [--fix]
        files: ^application/backend/
      - id: ruff-format
        name: "[BE] Ruff Format"
        files: ^application/backend/

  # Local hooks for frontend (Biome, Prettier)
  - repo: local
    hooks:
      - id: prettier-json-yaml-frontend
        name: "[FE] Prettier (format JSON/YAML)"
        entry: bash -c 'for file in "$@"; do (cd application/frontend && pnpm exec prettier --ignore-unknown --write "${file#application/frontend/}"); done' --
        language: system
        files: ^application/frontend/.*\.(json|ya?ml)$
        exclude: ^application/frontend/pnpm-lock\.yaml$
        pass_filenames: true

      - id: biome-check-frontend
        name: "[FE] Biome Check"
        entry: bash -c 'cd application/frontend && pnpm run check:fix'
        language: system
        types: [javascript, jsx, ts, tsx, json, css]
        pass_filenames: false
        files: ^application/frontend/

      - id: prettier-tailwind-frontend
        name: "[FE] Prettier + Tailwind CSS"
        entry: bash -c 'for file in "$@"; do (cd application/frontend && pnpm exec prettier --ignore-unknown --write "${file#application/frontend/}"); done; git add "$@"' --
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^application/frontend/
        pass_filenames: true

      - id: biome-ci-frontend
        name: "[FE] Biome CI"
        entry: bash -c 'cd application/frontend && pnpm run ci'
        language: system
        types: [javascript, jsx, ts, tsx, json, css]
        pass_filenames: false
        files: ^application/frontend/
        stages: [pre-push]
