# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install (run from project root)
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: biome-check-frontend
        name: Biome Check (Frontend)
        entry: bash -c 'cd application/frontend && npm run check:fix'
        language: system
        types: [javascript, jsx, ts, tsx, json, css]
        pass_filenames: false
        files: ^application/frontend/
        
      - id: biome-ci-frontend
        name: Biome CI (Frontend - strict)
        entry: bash -c 'cd application/frontend && npm run ci'
        language: system
        types: [javascript, jsx, ts, tsx, json, css]
        pass_filenames: false
        files: ^application/frontend/
        stages: [pre-push]
