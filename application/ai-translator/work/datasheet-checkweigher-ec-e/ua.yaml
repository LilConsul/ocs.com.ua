pages:
- title:
  - Компактна конструкція,
  - висока продуктивність
  blocks:
  - type: lead
    text: Надійність і прозорість виробничих даних є основою будь-якого планування. Контрольно динамічні
      ваги **EC-E** від WIPOTEC гарантують 100% збір даних у поточному виробництві.
  - type: columns
    paragraphs:
    - EC-E з продуктивністю 150 зважувань за хвилину є правильним вибором для вас. Інтуїтивний інтерфейс
      користувача забезпечує зручне керування через чітко структурований 8-дюймовий кольоровий сенсорний
      дисплей. Контрольно динамічні ваги EC-E точно зважують кожну окрему одиницю продукції, записують
      індивідуальні значення та відбраковують упаковки з некоректною масою за допомогою повністю автоматизованого
      відбракувального пристрою. Ваші дані збираються правильно й у повному обсязі, і ви маєте впевненість,
      що ваші виробничі цехи залишає лише продукція, яка відповідає вимогам підприємства.
    - Простота використання контрольно динамічних ваг практично виключає будь-які помилки введення. Надійне
      високотехнологічне обладнання, особливо для сектору сухих харчових продуктів, з дуже добрим співвідношенням
      ціни та якості в початковому сегменті ваг з електромагнітною компенсацією сили.
  - type: hero
    image: images/photo-2-1.jpg
    aside:
    - style: light
      title: Основні **характеристики**
      items:
      - 'Технологія зважування WIPOTEC: вагові комірки з електромагнітною компенсацією сили'
      - Рама з нержавіючої сталі
      - Шафа з нержавіючої сталі з інтегрованою системою керування
      - Три стрічки NT30 (підвідний конвеєр, конвеєр, що зважує, та відвідний конвеєр); полегшена конструкція
      - Сервоприводи, що не потребують обслуговування
      - Один відбракувальний пристрій (струмінь стисненого повітря)
      - Зручний для користувача інтерфейс на 8” кольоровому сенсорному TFT-дисплеї
      - Пам'ять на 50 різних параметрів продуктів (опція розширення до 200)
      - Синхронізація з лінією через безпотенційні комутаційні контакти / дискретні сигнали
      - Широкі статистичні функції та гістограми
    - style: dark
      title: Ваші **переваги**
      items:
      - Висока продуктивність до 150 шт/хв
      - Точні та надійні результати зважування для підвищення ефективності виробництва
      - Дуже добре співвідношення ціни та якості
      - Модульність під вимоги для максимальної гнучкості
