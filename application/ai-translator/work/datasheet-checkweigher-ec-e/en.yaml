pages:
- title:
  - COMPACT DESIGN,
  - BIG PERFORMANCE
  blocks:
  - type: lead
    text: Reliability and transparency of production data are the basis of all planning. The **EC-E**
      checkweigher from WIPOTEC-OCS guarantees 100% data capture in ongoing production.
  - type: columns
    paragraphs:
    - Capable of 150 weight values per minute, the EC-E is the right choice for you. The intuitive user
      interface ensures convenient operation via a clearly structured, 8-inch colour touchscreen. The
      EC-E checkweigher precisely weighs each individual product, records individual values, and ejects
      incorrect weight packages via the fully automated sorter. Your data is correctly and completely
      collected and you have the certainty that only factory compliant products leave your production
      halls.
    - The checkweigher‘s ease of use virtually excludes all incorrect entries. A reliable hightech machine,
      especially in the dry foods sector, with a very good price-performance ratio in the EMFR entry segment.
  - type: hero
    image: images/photo-2-1.jpg
    aside:
    - style: light
      title: MAIN **FEATURES**
      items:
      - WIPOTEC Weighing Technology EMFR Weigh Cells
      - Stainless steel frame
      - Stainless steel cabinet with integrated control system
      - Three NT30 belts (infeed, weighing and outfeed conveyors); Lightweight construction
      - Maintenance-free servo drives
      - One sorter attachment (air blast)
      - User friendly interface via 8“ colour TFT touchscreen display
      - Memory for 50 different product parameters (option to expand to 200)
      - Line synchronisation with potential-free switching contacts/binary signals
      - Extensive statistical functions/histograms
    - style: dark
      title: YOUR **BENEFITS**
      items:
      - High throughput rate of up to 150 pcs/min
      - Precise and reliable weighing results to increase plant efficiency
      - Very good price-performance ratio
      - Requirements-based modularity for the greatest flexibility
