pages:
- title:
  - Контрольно динамічні ваги для точного
  - визначення маси важкої продукції
  blocks:
  - type: lead
    text: Контрольно динамічні ваги для важкої продукції WIPOTEC **HC-M-SL** створюють оптимальні умови
      для високодинамічного контролю фактичної маси продукції до 60 кг за одиницю або перевірки комплектності.
      Завдяки швидкості стрічки до 2 м/с їх можна інтегрувати у високошвидкісні виробничі лінії.
  - type: columns
    paragraphs:
    - Легкі запатентовані конвеєрні системи та особливо ретельно збалансована концепція приводу забезпечують
      максимальну плавність і рівномірний хід, а також швидке й безпечне транспортування продукції. Модель
      HC-M-SL доступна з широким вибором комбінацій довжини та ширини конвеєра, що дає змогу реалізовувати
      індивідуальні рішення для продукції найрізноманітнішої форми.
    - Контрольно динамічні ваги для важкої продукції можна оснастити опціональними пристроями для відбракування
      та сортування з широкого продуманого асортименту (наприклад, штовхачі, відкидний конвеєр тощо),
      які надійно видаляють продукцію з некоректною масою. Усі моделі постачаються як комплексна система
      з базовою рамою та шафою керування з нержавіючої сталі й відповідають вимогам класу промислового
      захисту IP54.
  - type: hero
    image: images/photo-2-1.jpg
    aside:
    - style: light
      title: Основні **характеристики**
      items:
      - Асинхронні двигуни, що не потребують обслуговування
      - Затвердження типу (MID)
      - Вагова комірка з електромагнітною компенсацією сили
      - Просте керування через меню на 10.4” кольоровому сенсорному TFT-дисплеї
      - Проста заміна стрічок і конвеєрів
      - Гнучка інтеграція у виробничі лінії
      - Синхронізація з лінією через сигнали I/O типу «сухий контакт»
    - style: dark
      title: Ваші **переваги**
      items:
      - Комплексна система для точного визначення маси та перевірки комплектності
      - Швидкість стрічки до 2 м/с
      - Просте та зручне керування
      - Малошумна конвеєрна система
- title:
  - Технічні
  - дані
  blocks:
  - type: table
    title: '**Базові** дані'
    rows:
    - label: Матеріал виготовлення обладнання
      value: Масивна рама з нержавіючої сталі
    - label: Маса обладнання (стандартне виконання)
      value: 150 кг
    - label: Транспортна маса (стандартне виконання)
      value: 250 кг
    - label: Клас промислового захисту
      value: IP54
    - label: Діапазон робочих температур
      value: від +5 °С до +40 °С
    - label: Дисплей і керування
      value: Шафа з кольоровим сенсорним TFT-дисплеєм 10.4” з регулюванням нахилу (опціонально окремо
        стояча шафа)
    - label: Доступні мови інтерфейсу
      value: китайська, хорватська, чеська, данська, нідерландська, англійська, фінська, французька, німецька,
        грецька, угорська, італійська, японська, латиська, литовська, польська, португальська, російська,
        словацька, словенська, іспанська, шведська, турецька, українська (інші мови за запитом)
    - label: Інтерфейси
      value: 'Опціонально: RS232, RS422, RS485, Ethernet, USB (для принтера та резервного копіювання)'
      note: 1
    - label: Швидкість
      value: 'HC-M-SL-1: макс. 1.0 м/с (опціонально до 2.0 м/с) | HC-M-SL-2: макс. 2.0 м/с'
    - label: Цифрові входи/виходи
      value: 8 входів + 8 виходів (з опціональним розширенням)
    - label: Пам'ять параметрів продуктів
      value: 100 PPS (опціонально 200 / 400 PPS)
    - label: Привід
      value: Асинхронний двигун із частотним перетворювачем
    - label: Рівень шуму
      value: < 70 дБ(A)
      note: 2
    - label: Номінальна напруга
      value: L1/N/PE; на вибір 115 В або 230 В змінного струму
    - label: Номінальна частота
      value: 50/60 Гц
    - label: Потужність підключення (повна потужність)
      value: Прибл. 1.8 кВА
    - label: Подача стисненого повітря (опція)
      value: 6 бар, прибл. 16 Нл/хв, клас якості (за ISO 8573-1) [5:3:3]
    - label: Макс. можлива кількість підключених двигунів
      value: 1 двигун (опціонально ще 2 через розширення)
    - label: Сертифікат експертизи типу ЄС
      value: DE-18-MI006-PTB001 (MID)
  - type: grid
    title: Параметри **зважування**
    header:
    - ''
    - Вагова комірка (тип)
    - GWR (діапазон зважування брутто)
    - Макс. руйнівне навантаження
    - e (ціна повірочної поділки)
    - d (дискретність)
    - Стандартне відхилення 2) (1s)
    - n (кількість повірочних поділок)
    rows:
    - - HC-M-SL-1
      - IW-B-60k
      - 30000 г
      - 60000 г
      - ≥ 5.0 г
      - ≥ 0.5 г
      - від 500 мг
      - '6000'
    - - HC-M-SL-2
      - IW-B-150k
      - 60000 г
      - 150000 г
      - ≥ 10.0 г
      - ≥ 1.0 г
      - від 500 мг
      - '6000'
  - type: footnotes
