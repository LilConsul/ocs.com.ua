pages:
- title:
  - WEIGHING AND METAL DETECTION
  - IN ONE INTEGRATED UNIT
  blocks:
  - type: lead
    text: If high precision weighing of your products is not enough and you require an additional reliable
      inspection for metallic impurities, you need the **HC-M-MDi**. This machine is a high-tech combination
      scale and metal detector, together in one compact unit that sets the quality standard in terms of
      product safety.
  - type: columns
    paragraphs:
    - The entire system is controlled via the menu-driven, user-friendly controls of the checkweigher.
      The central control point conveniently manages the product parameters, protocols, and production
      statistics. Naturally, you will find all of the conventional performance characteristics of metal
      detectors (for example, product tracking, compensating for the product effect, FPV compliance checks,
      etc.), provided in the HC-M-MDi. This model is a high-precision weighing instrument and fully integrated
      metal detector all in one compact unit. The use of high-tech Weigh Cells from WIPOTEC, which operate
      according to the principle of Electro-Magnetic Force Restoration (EMFR), guarantees optimal weighing
      results with the best technology. The easy and intuitive software interface ensures comfortable
      operation on an 10.4-inch, clearly laid out, colour TFT display with touchscreen.
  - type: hero
    image: images/photo-2-1.jpg
    aside:
    - style: light
      title: MAIN **FEATURES**
      items:
      - User friendly interface via one HMI
      - Separate sort out metal/weight
      - Flexible integration in production lines
    - style: dark
      title: YOUR **BENEFITS**
      items:
      - Conveyor belt in stainless steel (optional) for highest flexibility
      - Fully integrated metal detector for extensive control.
