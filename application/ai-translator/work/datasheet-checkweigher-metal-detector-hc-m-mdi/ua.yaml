pages:
- title:
  - Зважування та металодетекція
  - в одному інтегрованому блоці
  blocks:
  - type: lead
    text: Якщо високоточного зважування вашої продукції недостатньо і вам потрібен додатковий надійний
      контроль на наявність металевих домішок, обирайте **HC-M-MDi**. Це обладнання є високотехнологічною
      комбінацією ваг і металодетектора, об'єднаних в один компактний блок, що встановлює стандарт якості
      в галузі безпеки продукції.
  - type: columns
    paragraphs:
    - Керування всією системою здійснюється через зручний інтерфейс контрольно динамічних ваг із роботою
      через меню. Центральний пункт керування дозволяє зручно налаштовувати параметри продуктів, вести
      протоколи та виробничу статистику. Звісно, HC-M-MDi має всі звичні функціональні характеристики
      металодетекторів (наприклад, відстеження продукту, компенсацію ефекту продукту, перевірки відповідності
      FPV тощо). Ця модель поєднує високоточний ваговимірювальний прилад і повністю інтегрований металодетектор
      в одному компактному блоці. Використання високотехнологічних вагових комірок WIPOTEC, що працюють
      за принципом електромагнітної компенсації сили, гарантує оптимальні результати зважування завдяки
      найкращій технології. Простий та інтуїтивний програмний інтерфейс забезпечує зручну роботу на наочному
      10.4-дюймовому кольоровому сенсорному TFT-дисплеї.
  - type: hero
    image: images/photo-2-1.jpg
    aside:
    - style: light
      title: Основні **характеристики**
      items:
      - Зручний інтерфейс користувача через один HMI
      - Роздільне відбракування за металом і масою
      - Гнучка інтеграція у виробничі лінії
    - style: dark
      title: Ваші **переваги**
      items:
      - 2 відбракувальних пристрої – для продукції із сторонніми металевими включеннями та продукції з некоректною вагою
      - Повністю інтегрований металодетектор для всебічного контролю
- title:
  - Технічні
  - дані
  blocks:
  - type: table
    title: '**Базові** дані'
    rows:
    - label: Матеріал виготовлення обладнання
      value: Рама з нержавіючої сталі V2A/AISI 304
    - label: Маса обладнання (стандартне виконання)
      value: 260 кг
    - label: Транспортна маса (стандартне виконання)
      value: 330 кг
    - label: Клас промислового захисту
      value: IP54
      note: 1
    - label: Діапазон робочих температур
      value: від +5 °С до +40 °С
    - label: Дисплей і керування
      value: Кольоровий сенсорний TFT-дисплей 10.4” з регулюванням нахилу
    - label: Доступні мови інтерфейсу
      value: китайська, хорватська, чеська, данська, нідерландська, англійська, фінська, французька, німецька,
        грецька, угорська, італійська, японська, латиська, литовська, польська, португальська, російська,
        словацька, словенська, іспанська, шведська, турецька, українська (інші мови за запитом)
    - label: Інтерфейси
      value: 'Опціонально: Ethernet, OPC, Profibus, ProfiNet, EtherNet/IP, RS232, RS422, RS485'
      note: 2
    - label: Макс. продуктивність
      value: 250 шт/хв
      note: 3
    - label: Цифрові входи/виходи
      value: 8 входів + 8 виходів (з опціональним розширенням)
    - label: Пам'ять параметрів продуктів
      value: 100 PPS (опціонально 200 / 400 PPS)
    - label: Привід
      value: Сервопривід
    - label: Рівень шуму
      value: < 70 дБ(A)
      note: 3
    - label: Номінальна напруга
      value: L1/N/PE; 100-240 В змінного струму
    - label: Номінальна частота
      value: 50/60 Гц
    - label: Потужність підключення (повна потужність)
      value: Прибл. 0.8 кВА
    - label: Подача стисненого повітря (опція)
      value: 6 бар, прибл. 16 Нл/хв, клас якості (за ISO 8573-1) [5:3:3]
    - label: Макс. можлива кількість підключених двигунів
      value: 3 двигуни (опціонально ще 2 через розширення)
    - label: Сертифікат експертизи типу ЄС
      value: DE-18-MI006-PTB001 (MID)
  - type: grid
