      - від 100 мг
      - '7500'
    - - HC-M-MDi-3000-2
      - EC-3000-2
      - 3750 г
      - 8500 г
      - ≥ 0.5 г
      - ≥ 0.05 г
      - від 100 мг
      - '7500'
  - type: footnotes
    items:
    - 1) Захист від води зверху; повний захист IP65 див. у виконаннях VA або WD (IP69K)
