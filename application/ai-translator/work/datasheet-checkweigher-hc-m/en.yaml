pages:
- title:
  - HIGH PRECISION WEIGHING FOR
  - MEDIUM SPEED APPLICATIONS
  blocks:
  - type: lead
    text: The dynamic **HC-M** checkweigher is the ideal medium speed weighing solution for a wide range
      of checking, regulation and control tasks. The HC-M checkweighers are the next step up on the performance
      curve from the entry level EC-E machines. HC-M machines are capable of 250 weighing operations per
      minute.
  - type: columns
    paragraphs:
    - The HC-M checkweigher offers you operator-friendly solutions. It doesn’t matter whether you want
      to check the current actual weight, carry out a completeness check on your products or perform sorting
      or classification. The sturdy base frame made of stainless steel enables high weighing accuracy
      at medium belt speeds or throughput rates. Checkweighers from WIPOTEC-OCS are a byword for 100%
      product monitoring.
    - The lightweight, patented conveyor systems and the particularly carefully coordinated drive concept
      ensure optimum smoothness with quiet running and fast, safe product transport. Individually adapted
      solutions can be implemented in a modular fashion for a wide range of product shapes. A sophisticated
      and wide spectrum of sorting devices (e.g. pusher, air blast nozzles) is available to reject products
      with incorrect weight reliably and without disturbing production.
  - type: hero
    image: images/photo-2-1.jpg
    aside:
    - style: light
      title: MAIN **FEATURES**
      items:
      - Entire machine in stainless steel housing with infeed, weighing, and outfeed belts (NT30)
      - One sorter attachment (air blast)
      - Maintenance-free servo drives
      - Certified (MID)
      - WIPOTEC EMFR Weigh Cells
      - Simple, menu-directed operation on 10.4“ colour TFT touchscreen
      - Memory for 100 product parameters
      - Easy, tool-free exchange of belts and conveyors
      - Flexible integration in production lines
      - Line synchronisation with potential-free I/O signals
      - Extensive statistical functions/histograms for production documentation
    - style: dark
      title: YOUR **BENEFITS**
      items:
      - Maximum throughput 250 pcs/min
      - Exact fill results for higher productivity
      - Efficiency improvement through simple and user-friendly controls
      - Requirements-based modularity for the greatest flexibility
