pages:
- title:
  - Високоточне зважування
  - на середніх швидкостях
  blocks:
  - type: lead
    text: Контрольно динамічні ваги **HC-M** є ідеальним рішенням для зважування на середніх швидкостях
      у широкому спектрі завдань перевірки, регулювання та контролю. За продуктивністю HC-M є наступним
      щаблем після обладнання початкового рівня EC-E і виконує 250 зважувань за хвилину.
  - type: columns
    paragraphs:
    - Контрольно динамічні ваги HC-M пропонують рішення, зручні для оператора. Не має значення, чи потрібно
      перевірити поточну фактичну масу або комплектність продукції, чи виконати сортування або класифікацію.
      Міцна базова рама з нержавіючої сталі забезпечує високу точність зважування за середніх швидкостей
      стрічки або продуктивності. Контрольно динамічні ваги WIPOTEC є синонімом 100% контролю продукції.
    - Легкі запатентовані конвеєрні системи та особливо ретельно узгоджена концепція приводу забезпечують
      оптимальну плавність і тиху роботу, а також швидке й безпечне транспортування продукції. Індивідуальні
      рішення реалізуються за модульним принципом для продукції найрізноманітнішої форми. Продуманий широкий
      вибір відбракувальних пристроїв (наприклад, штовхач, сопла для струменя стисненого повітря) надійно
      видаляє продукцію з некоректною масою, не порушуючи виробничий процес.
  - type: hero
    image: images/photo-2-1.jpg
    aside:
    - style: light
      title: Основні **характеристики**
      items:
      - Усе обладнання в корпусі з нержавіючої сталі з підвідною, зважувальною та відвідною стрічками
        (NT30)
      - Один відбракувальний пристрій (струмінь стисненого повітря)
      - Сервоприводи, що не потребують обслуговування
      - Сертифіковано (MID)
      - Вагові комірки з електромагнітною компенсацією сили
      - Просте керування через меню на 10.4” кольоровому сенсорному TFT-дисплеї
      - Пам'ять на 100 параметрів продуктів
      - Проста заміна стрічок і конвеєрів без інструменту
      - Гнучка інтеграція у виробничі лінії
      - Синхронізація з лінією через безпотенційні сигнали I/O
      - Широкі статистичні функції та гістограми для виробничої документації
    - style: dark
      title: Ваші **переваги**
      items:
      - Максимальна продуктивність 250 шт/хв
      - Точні результати наповнення для вищої продуктивності
      - Підвищення ефективності завдяки простому та зручному керуванню
      - Модульність під вимоги для максимальної гнучкості
- title:
  - Технічні
  - дані
  blocks:
  - type: table
    title: '**Базові** дані'
    rows:
    - label: Матеріал виготовлення обладнання
      value: Рама з нержавіючої сталі V2A/AISI 304
    - label: Маса обладнання (стандартне виконання)
      value: 230 кг
    - label: Транспортна маса (стандартне виконання)
      value: 300 кг
    - label: Клас промислового захисту
      value: IP54
      note: 1
    - label: Діапазон робочих температур
      value: від +5 °С до +40 °С
    - label: Дисплей і керування
      value: Кольоровий сенсорний TFT-дисплей 10.4” з регулюванням нахилу
    - label: Доступні мови інтерфейсу
      value: китайська, хорватська, чеська, данська, нідерландська, англійська, фінська, французька, німецька,
        грецька, угорська, італійська, японська, латиська, литовська, польська, португальська, російська,
        словацька, словенська, іспанська, шведська, турецька, українська (інші мови за запитом)
    - label: Інтерфейси
      value: 'Опціонально: Ethernet, OPC, Profibus, ProfiNet, EtherNet/IP, RS232, RS422, RS485'
      note: 2
    - label: Макс. продуктивність
      value: 250 шт/хв
      note: 3
    - label: Цифрові входи/виходи
      value: 8 входів + 8 виходів (з опціональним розширенням)
    - label: Пам'ять параметрів продуктів
      value: 100 PPS (опціонально 200 / 400 PPS)
    - label: Привід
      value: Сервопривід
    - label: Рівень шуму
      value: < 70 дБ(A)
      note: 3
    - label: Номінальна напруга
      value: L1/N/PE; 100-240 В змінного струму
    - label: Номінальна частота
      value: 50/60 Гц
    - label: Потужність підключення (повна потужність)
      value: Прибл. 0.8 кВА
    - label: Подача стисненого повітря (опція)
      value: 6 бар, прибл. 16 Нл/хв, клас якості (за ISO 8573-1) [5:3:3]
    - label: Макс. можлива кількість підключених двигунів
      value: 3 двигуни (опціонально ще 2 через розширення)
    - label: Сертифікат експертизи типу ЄС
