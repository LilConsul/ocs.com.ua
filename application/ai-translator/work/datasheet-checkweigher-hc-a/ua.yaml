pages:
- title:
  - Найвищі стандарти
  - динамічного зважування
  blocks:
  - type: lead
    text: 'За точністю та продуктивністю контрольно динамічні ваги серії **HC-A** є логічною відповіддю
      на вимоги сучасного динамічного зважування. Система керування та інженерні рішення обладнання створюють
      ідеальну платформу для складних завдань контролю та регулювання. HC-A є основою високоякісних систем
      під конкретне застосування: до 600 зважувань за хвилину зі 100% контролем продукції.'
  - type: columns
    paragraphs:
    - 'Ця модель значно розширює можливості застосування продуктової лінійки WIPOTEC і доповнює наш універсальний
      асортимент обладнання, особливо для високоякісних застосувань. Вона продовжує нашу успішну концепцію
      продукції та керування. Зокрема, вдосконалена масивна рама з нержавіючої сталі забезпечує надзвичайно
      точне зважування навіть за дуже високих швидкостей транспортування та продуктивності. Модульна конструкція
      спрощує створення індивідуальних рішень для продукції різної геометрії та форми. Продуманий широкий
      вибір відбракувальних пристроїв (штовхач, струмінь стисненого повітря тощо) надійно видаляє продукцію
      з некоректною масою. HC-A вирізняється всебічною роботою з продукцією: наприклад, верхні притискні
      стрічки надійно приймають і прискорюють картонні короби, так само як шнек-розділювач і бокові притискні
      стрічки надійно розділяють і прискорюють флакони та пляшки. Низка опціональних функцій HC-A допомагає
      мінімізувати дороге перевищення маси наповнення.'
  - type: hero
    image: images/photo-2-1.jpg
    aside:
    - style: light
      title: Основні **характеристики**
      items:
      - Міцна масивна рама з нержавіючої сталі
      - Один відбракувальний пристрій (струмінь стисненого повітря або штовхач)
      - Сервопривід, що не потребує обслуговування
      - Сертифіковано (MID)
      - Вагова комірка з електромагнітною компенсацією сили
      - Просте керування через меню на 15” кольоровому сенсорному TFT-дисплеї
      - Проста заміна стрічок і конвеєрів без інструменту
      - Гнучка інтеграція у виробничі лінії
      - Синхронізація з лінією через безпотенційні сигнали I/O (розширювана опція)
      - Різна ширина та довжина конвеєрних стрічок
      - Широкі статистичні функції та гістограми
    - style: dark
      title: Ваші **переваги**
      items:
      - Максимальна продуктивність 600 шт/хв
      - Підвищення ефективності завдяки простому та зручному керуванню
      - Модульність під вимоги для максимальної гнучкості
      - Ефективність установки знижує сукупну вартість володіння (TCO)
- title:
  - Технічні
  - дані
  blocks:
  - type: table
    title: '**Базові** дані'
    rows:
    - label: Матеріал виготовлення обладнання
      value: Рама з нержавіючої сталі V2A/AISI 304
    - label: Маса обладнання (стандартне виконання)
      value: 250 кг
    - label: Транспортна маса (стандартне виконання)
      value: 320 кг
    - label: Клас промислового захисту
      value: IP54
      note: 1
    - label: Діапазон робочих температур
      value: від +5 °С до +40 °С
    - label: Дисплей і керування
      value: Поворотний кольоровий сенсорний TFT-дисплей 15” з регулюванням нахилу
    - label: Доступні мови інтерфейсу
      value: китайська, хорватська, чеська, данська, нідерландська, англійська, фінська, французька, німецька,
        грецька, угорська, італійська, японська, латиська, литовська, польська, португальська, російська,
        словацька, словенська, іспанська, шведська, турецька, українська (інші мови за запитом)
    - label: Інтерфейси
      value: 'Опціонально: Ethernet, OPC, Profibus, ProfiNet, EtherNet/IP, RS232, RS422, RS485'
      note: 2
    - label: Макс. продуктивність
      value: 600 шт/хв
      note: 3
    - label: Цифрові входи/виходи
      value: 8 входів + 8 виходів (з опціональним розширенням)
    - label: Пам'ять параметрів продуктів
      value: 100 PPS (опція 200 / 400 PPS)
    - label: Привід
      value: Сервопривід
    - label: Рівень шуму
      value: < 70 дБ(A)
      note: 3
    - label: Номінальна напруга
      value: L1/N/PE; 100-240 В змінного струму
    - label: Номінальна частота
      value: 50/60 Гц
    - label: Потужність підключення (повна потужність)
      value: Прибл. 0.8 кВА
    - label: Подача стисненого повітря (опція)
      value: 6 бар, прибл. 16 Нл/хв, клас якості (за ISO 8573-1) [5:3:3]
    - label: Макс. можлива кількість підключених двигунів
      value: 3 двигуни (опціонально ще 3 через розширення)
    - label: Сертифікат експертизи типу ЄС
      value: DE-18-MI006-PTB001 (MID)
