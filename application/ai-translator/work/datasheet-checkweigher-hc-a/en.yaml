pages:
- title:
  - FOR THE HIGHEST STANDARDS
  - IN DYNAMIC WEIGHING
  blocks:
  - type: lead
    text: In terms of precision and throughput, checkweighers of the **HC-A** series are the logical response
      to meet the demands of modern, dynamic weighing technology. The machines provide the controls and
      engineering to create the ideal platform for implementing the complex regulation and control tasks.
      The HC-A is the basis for high-end application-oriented systems that provide a maximum of 600 values
      per minute with 100% product monitoring.
  - type: columns
    paragraphs:
    - This model significantly extends the application possibilities of the product line from WIPOTEC-OCS
      and completes our versatile product range, especially for high-end applications. This machine continues
      the use of our successful product and operating concept. In particular, the advanced solid stainless
      steel frame ensures extremely accurate weighing results at very high transport speeds or throughput
      rates. The modular design facilitates the implementation of custom solutions for a variety of product
      geometries and forms. The sophisticated and wide selection of sorters (pusher, air blast, etc.)
      is designed to reliably eject products with incorrect weights with respect to packaging. The HC-A
      is characterised by its comprehensive product handling. For example, the top runner belts safely
      perform acceptance and acceleration of folded cartons just as the metering screw and lateral pressure
      belts safely separates and accelerates vials and bottles. The HC-A supports your efforts to minimise
      costly overfilling with a number of optional functions.
  - type: hero
    image: images/photo-2-1.jpg
    aside:
    - style: light
      title: MAIN **FEATURES**
      items:
      - Sturdy, solid stainless steel frame
      - One sorter (air blast or pusher)
      - Maintenance-free servo-drive
      - Certified (MID)
      - WIPOTEC EMFR Weigh Cell
      - Simple, menu-directed operation via a 15“ colour TFT touchscreen
      - Easy, tool-free exchange of belts and conveyors
      - Flexible integration in production lines
      - Line synchronisation with potential-free I/O signals (expandable option)
      - Variable conveyor belt widths and lengths
      - Extensive statistical functions/histograms
    - style: dark
      title: YOUR **BENEFITS**
      items:
      - Maximum output 600 pcs/min
      - Exact fill results for highest productivity
      - Efficiency improvement through simple and user-friendly controls
      - Requirements-based modularity for the greatest flexibility
      - Greater unit efficiency means a positive contribution to reducing TCO
