<!doctype html>
<html lang="uk">
	<body style="margin: 0; padding: 24px; background: #f3f4f6; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #111827">
		<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; border-collapse: separate; overflow: hidden">
			<tr>
				<td style="background: #111827; color: #ffffff; padding: 20px 24px">
					<div style="font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #9ca3af">Сайт {{ site }}</div>
					<h2 style="margin: 4px 0 0; font-size: 20px">Нове звернення з сайту</h2>
				</td>
			</tr>
			<tr>
				<td style="padding: 20px 24px">
					<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse: collapse; width: 100%">
						<tr>
							<td style="padding: 8px 16px 8px 0; color: #6b7280; white-space: nowrap; vertical-align: top; border-bottom: 1px solid #f3f4f6">Ім'я</td>
							<td style="padding: 8px 0; font-weight: 600; border-bottom: 1px solid #f3f4f6">{{ name }}</td>
						</tr>
						<tr>
							<td style="padding: 8px 16px 8px 0; color: #6b7280; white-space: nowrap; vertical-align: top; border-bottom: 1px solid #f3f4f6">Посада</td>
							<td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6">{{ jobTitle }}</td>
						</tr>
						<tr>
							<td style="padding: 8px 16px 8px 0; color: #6b7280; white-space: nowrap; vertical-align: top; border-bottom: 1px solid #f3f4f6">Компанія</td>
							<td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6">{{ company }}</td>
						</tr>
						<tr>
							<td style="padding: 8px 16px 8px 0; color: #6b7280; white-space: nowrap; vertical-align: top; border-bottom: 1px solid #f3f4f6">Телефон</td>
							<td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6">{{ phone }}</td>
						</tr>
						<tr>
							<td style="padding: 8px 16px 8px 0; color: #6b7280; white-space: nowrap; vertical-align: top; border-bottom: 1px solid #f3f4f6">Email</td>
							<td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6">{{ email }}</td>
						</tr>
						<tr>
							<td style="padding: 8px 16px 8px 0; color: #6b7280; white-space: nowrap; vertical-align: top; border-bottom: 1px solid #f3f4f6">Галузь</td>
							<td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6">{{ sector }}</td>
						</tr>
						<tr>
							<td style="padding: 8px 16px 8px 0; color: #6b7280; white-space: nowrap; vertical-align: top">Обладнання</td>
							<td style="padding: 8px 0">{{ equipment }}</td>
						</tr>
					</table>

					<h3 style="margin: 24px 0 8px; font-size: 14px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px">Повідомлення</h3>
					<div style="background: #f9fafb; border-left: 3px solid #111827; padding: 12px 16px; border-radius: 4px; white-space: pre-wrap; line-height: 1.5">{{ message }}</div>
				</td>
			</tr>
		</table>
	</body>
</html>
