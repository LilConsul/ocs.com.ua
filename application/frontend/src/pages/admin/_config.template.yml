# Decap CMS config template, served by config.yml.ts.
backend:
  name: github
  repo: __GITHUB_REPO__
  branch: __GITHUB_BRANCH__
  base_url: __BASE_URL__
  auth_endpoint: /api/auth
  commit_messages:
    create: '[CMS] Create: {{collection}} "{{slug}}"'
    update: '[CMS] Update: {{collection}} "{{slug}}"'
    delete: '[CMS] Delete: {{collection}} "{{slug}}"'
    uploadMedia: '[CMS] Upload: "{{path}}"'
    deleteMedia: '[CMS] Delete: "{{path}}"'
    openAuthoring: '[CMS] {{message}}'
  squash_merges: true

  #name: test-repo

publish_mode: editorial_workflow

site_url: __SITE_URL__
display_url: __SITE_URL__

logo:
  src: /admin-logo.svg
  show_in_header: true

locale: __CMS_LOCALE__

# Search is off by default to avoid exhausting GitHub API rate limits on large collections
search: __CMS_SEARCH__

# Report issues to the project repo, not Decap's default
issue_reports:
  url: https://github.com/LilConsul/ocs.com.ua/issues/new

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

media_folder: "application/frontend/public/assets"
public_folder: "/assets"

# Convert all uploaded images to WebP, cap at 1600 px wide, strip EXIF metadata
media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 82
  strip_metadata: true
  width: 1600
  height: null

i18n:
  structure: multiple_files
  locales: [en, ua]
  default_locale: ua

collections:
  # ── Authorization Documents ───────────────────────────────────────────────
  - name: "documents"
    label: "Documents"
    delete: false
    editor:
      preview: false
    files:
      - name: "authorization-letters"
        label: "Authorization Letters"
        file: "application/frontend/src/data/documents.json"
        format: json
        media_folder: "../../public/assets/documents"
        public_folder: "/assets/documents"
        fields:
          - label: "Wipotec Authorization Letter (PDF)"
            name: "wipotec"
            widget: "file"
            required: false
            hint: "Upload the official Wipotec Authorization Letter (PDF)"
          - label: "Mesutronic Authorization Letter (PDF)"
            name: "mesutronic"
            widget: "file"
            required: false
            hint: "Upload the official Mesutronic Authorization Letter (PDF)"

  # ── Company Information ───────────────────────────────────────────────────
  - name: "company"
    label: "Company"
    delete: false
    editor:
      preview: false
    files:
      - name: "company-info"
        label: "Company Information"
        file: "application/frontend/src/data/company.json"
        format: json
        fields:
          - { label: "Phone Number", name: "phone", widget: "string", hint: "e.g. +38 067 35 33 853" }
          - { label: "Email Address", name: "email", widget: "string", hint: "e.g. info@ocs.com.ua" }
          - label: "Contact Person"
            name: "contactPerson"
            widget: "object"
            fields:
              - label: "English"
                name: "en"
                widget: "object"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
              - label: "Ukrainian"
                name: "ua"
                widget: "object"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
          - label: "Working Hours"
            name: "workingHours"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", hint: "e.g. Mon-Fri, 9:00 - 18:00 (Kyiv)" }
              - { label: "Ukrainian", name: "ua", widget: "string", hint: "e.g. Пн-Пт, 9:00 - 18:00 (Київ)" }
          - label: "Address"
            name: "address"
            widget: "object"
            fields:
              - label: "English"
                name: "en"
                widget: "object"
                fields:
                  - { label: "Street", name: "street", widget: "string" }
                  - { label: "Office", name: "office", widget: "string", required: false, hint: "e.g. Office 9" }
                  - { label: "City", name: "city", widget: "string" }
                  - { label: "Postal Code", name: "postalCode", widget: "string" }
                  - { label: "Country", name: "country", widget: "string" }
              - label: "Ukrainian"
                name: "ua"
                widget: "object"
                fields:
                  - { label: "Street", name: "street", widget: "string" }
                  - { label: "Office", name: "office", widget: "string", required: false, hint: "e.g. Офіс 9" }
                  - { label: "City", name: "city", widget: "string" }
                  - { label: "Postal Code", name: "postalCode", widget: "string" }
                  - { label: "Country", name: "country", widget: "string" }

  # ── Equipment Categories & Industries ───────────────────────────────────────
  # File collection backed by JSON. Adding an entry creates a new category or
  # industry that auto-appears in the site sidebar and the product dropdowns.
  - name: "equipment-categories"
    label: "Categories & Industries"
    label_singular: "Category or Industry"
    description: >-
      Catalogue taxonomy. "Equipment Types" controls the sidebar label, icon and
      description of each equipment category; "Industries" does the same for each
      industry. Drag entries to reorder. New entries automatically populate the
      matching dropdown in Products.
    editor:
      preview: false
    i18n:
      structure: single_file
      locales: [en, ua]
      default_locale: en
    files:
      - name: "equipment-types"
        label: "Equipment Types"
        file: "application/frontend/src/data/equipment-types.json"
        format: json
        i18n: true
        fields:
          - label: "Categories"
            name: "categories"
            widget: list
            i18n: true
            hint: "Drag entries to reorder — the order here is the order in the sidebar."
            fields:
              - label: "Slug"
                name: "slug"
                widget: "hidden"
                i18n: duplicate
                required: false
              - label: "Title"
                name: "title"
                widget: "string"
                i18n: true
                hint: "Category name displayed in the sidebar, header, and product category dropdown."
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
                i18n: true
                hint: "Brief category overview shown at the top of the catalogue page."
              - label: "Icon"
                name: "icon"
                widget: "icon-select"
                required: false
                options: __ICON_OPTIONS__
      - name: "industries"
        label: "Industries"
        file: "application/frontend/src/data/industries.json"
        format: json
        i18n: true
        fields:
          - label: "Industries"
            name: "industries"
            widget: list
            i18n: true
            hint: "Drag entries to reorder — the order here is the order in the sidebar."
            fields:
              - label: "Slug"
                name: "slug"
                widget: "hidden"
                i18n: duplicate
                required: false
              - label: "Title"
                name: "title"
                widget: "string"
                i18n: true
                hint: "Industry name displayed in the sidebar, header, and product industries dropdown."
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
                i18n: true
                hint: "Brief industry overview shown at the top of the industry page."
              - label: "Icon"
                name: "icon"
                widget: "icon-select"
                required: false
                options: __ICON_OPTIONS__

  # ── Products ─────────────────────────────────────────────────────
  - name: "equipment"
    label: "Products"
    label_singular: "Equipment Product"
    description: >-
      Individual product pages, grouped by category folder. Open a category
      in the sidebar to see its products. Choose a category from the dropdown
      to place a new product in the correct folder.
    folder: "application/frontend/src/content/equipment"
    # File name comes from the "File name" field, not the (Cyrillic) title, so the URL stays clean
    # and both locale files share one base name.
    slug: "{{fields.file_name}}"
    create: true
    delete: false
    i18n: true
    preview_path: "{{locale}}/catalogue/equipment/{{dirname}}/{{filename}}"
    preview_path_date_field: "date"
    summary: "{{title}} [{{dirname}}/{{filename}}]"
    sortable_fields: ["commit_date", "order", "title", "commit_author"]
    view_filters: __INDUSTRY_FILTERS__
    view_groups:
      - label: "By Category"
        field: category
      - label: "By Order"
        field: order
    editor:
      preview: false
    # Products live in category sub-folders; without depth Decap only lists the top level.
    # subfolders: false = plain folder browsing (category folder shows its own files);
    # the legacy default expects <category>/<product>/index.md and shows nothing here.
    nested:
      depth: 2
      subfolders: false
    meta:
      path:
        widget: select
        label: "Category"
        options: __CATEGORY_OPTIONS__
    fields:
      # Named file_name, not slug: Astro's glob loader treats a frontmatter `slug` as the entry id.
      - label: "File name"
        name: "file_name"
        widget: "string"
        i18n: duplicate
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lowercase latin letters, digits and hyphens only, e.g. hc-a-md"]
        hint: >-
          Required. Becomes the file name and the page URL (e.g. hc-a-md gives
          /catalogue/equipment/checkweigher/hc-a-md). Use the model name in lowercase Latin
          letters, digits and hyphens only, no spaces or Ukrainian letters. Choose it once when
          creating the product: changing it later does NOT rename the file or the URL, and it must
          stay the same as the file's name.
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0, required: false, hint: "Lower numbers appear first within this category.", i18n: duplicate }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        i18n: false
        min: 0
        max: 3
        field:
          label: "Image"
          name: "image"
          widget: "image"
          media_processing:
            enabled: true
            format:
              enabled: true
              default: webp
            quality: 85
            strip_metadata: true
            width: 1200
            height: null
            aspect_ratio: 4x3
      - { label: "Datasheet", name: "datasheet", widget: "file", required: false, i18n: duplicate }
      - label: "Industries"
        name: "industries"
        widget: "select"
        required: false
        i18n: false
        multiple: true
        min: 0
        options: __INDUSTRY_OPTIONS__
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", required: false, i18n: true }
      - label: "Specifications"
        name: "specs"
        widget: "list"
        required: false
        i18n: true
        min: 0
        summary: "{{fields.title}}"
        hint: >-
          Groups of specification rows shown in a table on the product page. The catalogue card shows
          only the first 2 rows (the first value of each, if you list several separated by commas).
        fields:
          - { label: "Group title", name: "title", widget: "string", required: false, hint: "Heading above the rows, e.g. Conveyor. Leave empty for plain rows." }
          - label: "Rows"
            name: "items"
            widget: "list"
            required: false
            min: 0
            summary: "{{fields.label}}: {{fields.value}}"
            hint: "Rows shown for the whole group. Separate several values with commas."
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
      - { label: "Body", name: "body", widget: "richtext", required: false, i18n: true }
