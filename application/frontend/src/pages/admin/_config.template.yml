# Decap CMS config template, served by config.yml.ts.
backend:
  name: github
  repo: __GITHUB_REPO__
  branch: __GITHUB_BRANCH__
  base_url: __BASE_URL__
  auth_endpoint: /api/auth
  commit_messages:
    create: '[CMS] Create: {{collection}} "{{slug}}"'
    update: '[CMS] Update: {{collection}} "{{slug}}"'
    delete: '[CMS] Delete: {{collection}} "{{slug}}"'
    uploadMedia: '[CMS] Upload: "{{path}}"'
    deleteMedia: '[CMS] Delete: "{{path}}"'
    openAuthoring: '[CMS] {{message}}'
  squash_merges: true

  #name: test-repo

publish_mode: editorial_workflow

site_url: __SITE_URL__
display_url: __SITE_URL__

logo:
  src: /admin-logo.svg
  show_in_header: true

locale: __CMS_LOCALE__

# Search is off by default to avoid exhausting GitHub API rate limits on large collections
search: __CMS_SEARCH__

# Report issues to the project repo, not Decap's default
issue_reports:
  url: https://github.com/LilConsul/ocs.com.ua/issues/new

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

media_folder: "application/frontend/public/assets"
public_folder: "/assets"

# Convert all uploaded images to WebP, cap at 1600 px wide, strip EXIF metadata
media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 82
  strip_metadata: true
  width: 1600
  height: null

i18n:
  structure: multiple_files
  locales: [en, ua]
  default_locale: en

collections:
  # ── Authorization Documents ───────────────────────────────────────────────
  - name: "documents"
    label: "Documents"
    delete: false
    editor:
      preview: false
    files:
      - name: "authorization-letters"
        label: "Authorization Letters"
        file: "application/frontend/src/data/documents.json"
        format: json
        media_folder: "application/frontend/public/assets/documents"
        public_folder: "/assets/documents"
        fields:
          - label: "Wipotec Authorization Letter (PDF)"
            name: "wipotec"
            widget: "file"
            required: false
            hint: "Upload the official Wipotec Authorization Letter (PDF)"
          - label: "Mesutronic Authorization Letter (PDF)"
            name: "mesutronic"
            widget: "file"
            required: false
            hint: "Upload the official Mesutronic Authorization Letter (PDF)"

  # ── Equipment Categories ────────────────────────────────────────────────────
  # File collection backed by JSON. Adding an entry creates a new category that
  # auto-appears in the site sidebar and the product category dropdown.
  - name: "equipment-categories"
    label: "Equipment Categories"
    label_singular: "Equipment Category"
    description: >-
      Equipment type definitions. Each entry controls the sidebar label, icon
      and description for one category; drag entries to reorder. Adding a new entry here
      automatically populates the category dropdown in Products.
    editor:
      preview: false
    i18n:
      structure: single_file
      locales: [en, ua]
      default_locale: en
    files:
      - name: "equipment-types"
        label: "Equipment Types"
        file: "application/frontend/src/data/equipment-types.json"
        format: json
        i18n: true
        fields:
          - label: "Categories"
            name: "categories"
            widget: list
            i18n: true
            hint: "Drag entries to reorder — the order here is the order in the sidebar."
            fields:
              - label: "Slug"
                name: "slug"
                widget: "hidden"
                i18n: duplicate
                required: false
              - label: "Title"
                name: "title"
                widget: "string"
                i18n: true
                hint: "Category name displayed in the sidebar, header, and product category dropdown."
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
                i18n: true
                hint: "Brief category overview shown at the top of the catalogue page."
              - label: "Icon"
                name: "icon"
                widget: "icon-select"
                required: false
                options: __ICON_OPTIONS__

  # ── Products ─────────────────────────────────────────────────────
  - name: "equipment"
    label: "Products"
    label_singular: "Equipment Product"
    description: >-
      Individual product pages, grouped by category folder. Open a category
      in the sidebar to see its products. Choose a category from the dropdown
      to place a new product in the correct folder.
    folder: "application/frontend/src/content/equipment"
    create: true
    delete: false
    i18n: true
    preview_path: "{{locale}}/catalogue/{{dirname}}/{{filename}}"
    preview_path_date_field: "date"
    summary: "{{title}} [{{dirname}}/{{filename}}]"
    sortable_fields: ["commit_date", "order", "title", "commit_author"]
    view_filters:
      - label: "Food & Beverage"
        field: industries
        pattern: "food-beverage"
      - label: "Pharmaceutical"
        field: industries
        pattern: "pharmaceutical"
      - label: "Cosmetics"
        field: industries
        pattern: "cosmetics"
      - label: "General / Industrial"
        field: industries
        pattern: "general"
    view_groups:
      - label: "By Category"
        field: category
      - label: "By Order"
        field: order
    editor:
      preview: false
    # Products live in category sub-folders; without depth Decap only lists the top level.
    # subfolders: false = plain folder browsing (category folder shows its own files);
    # the legacy default expects <category>/<product>/index.md and shows nothing here.
    nested:
      depth: 2
      subfolders: false
    meta:
      path:
        widget: select
        label: "Category"
        options: __CATEGORY_OPTIONS__
    fields:
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0, required: false, hint: "Lower numbers appear first within this category.", i18n: duplicate }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        i18n: true
        min: 0
        max: 3
        field:
          label: "Image"
          name: "image"
          widget: "image"
          media_processing:
            enabled: true
            format:
              enabled: true
              default: webp
            quality: 85
            strip_metadata: true
            width: 1200
            height: null
            aspect_ratio: 4x3
      - { label: "Datasheet", name: "datasheet", widget: "file", required: false, i18n: duplicate }
      - label: "Industries"
        name: "industries"
        widget: "select"
        required: false
        i18n: true
        multiple: true
        min: 0
        options:
          - { label: "Food & Beverage", value: "food-beverage" }
          - { label: "Pharmaceutical", value: "pharmaceutical" }
          - { label: "Cosmetics", value: "cosmetics" }
          - { label: "General / Industrial", value: "general" }
          - { label: "Logistics & E-commerce", value: "logistics" }
          - { label: "Chemical", value: "chemical" }
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", required: false, i18n: true }
      - label: "Specifications"
        name: "specs"
        widget: "list"
        required: false
        i18n: true
        min: 0
        max: 20
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Value", name: "value", widget: "string" }
      - { label: "Body", name: "body", widget: "richtext", required: false, i18n: true }
