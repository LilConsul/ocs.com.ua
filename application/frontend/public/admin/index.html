<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>Admin Panel</title>
		<link rel="icon" type="image/svg+xml" href="/admin/favicon.svg" />
		<!-- Load config dynamically so category options are auto-generated from the content folder -->
		<link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
		<!-- Material Symbols for the icon-select widget in the editor UI -->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
		/>
	</head>
	<body>
		<script>window.CMS_MANUAL_INIT = true;</script>
		<script src="https://unpkg.com/decap-cms@^3.12.0/dist/decap-cms.js"></script>

		<!-- Register everything, then init -->
		<script>
			// Normalize bullet lists to '-' on save (remark@10 compatible)
			CMS.registerRemarkPlugin({ settings: { bullet: '-' } });

			// Inject Material Symbols font into the preview iframe so icons render
			CMS.registerPreviewStyle(
				'https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200',
				{ raw: false }
			);

			// Custom icon-select widget: clickable grid of Material Symbols.
			// Use Decap's global `h` (its bundled React.createElement) — elements from a
			// separately loaded React cause "Minified React error #525".
			(function() {
				var e = window.h;
				var ACCENT = '#009AA3';

				function tile(key, active, title, onClick, content) {
					return e('button', {
						key: key,
						type: 'button',
						title: title,
						onClick: onClick,
						style: {
							display: 'flex', alignItems: 'center', justifyContent: 'center',
							width: '48px', height: '48px', padding: 0, cursor: 'pointer',
							borderRadius: '6px',
							border: active ? '2px solid ' + ACCENT : '1px solid #ccc',
							background: active ? 'rgba(0,154,163,0.12)' : '#fff',
							color: active ? ACCENT : '#444'
						}
					}, content);
				}

				function IconControl(props) {
					var value = props.value || '';
					var options = props.field.get('options');
					var selectedLabel = '';

					var tiles = options ? options.map(function(opt) {
						var label = typeof opt === 'string' ? opt : opt.get('label');
						var val   = typeof opt === 'string' ? opt : opt.get('value');
						if (val === value) selectedLabel = label;
						return tile(val, val === value, label,
							function() { props.onChange(val); },
							e('span', { className: 'material-symbols-outlined', style: { fontSize: '28px', lineHeight: 1 } }, val)
						);
					}).toArray() : [];

					// "No icon" tile clears the value
					tiles.unshift(tile('__none', !value, 'No icon',
						function() { props.onChange(''); },
						e('span', { className: 'material-symbols-outlined', style: { fontSize: '24px', lineHeight: 1, color: '#999' } }, 'block')
					));

					return e('div', { id: props.forID },
						e('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '8px' } }, tiles),
						e('div', { style: { marginTop: '8px', fontSize: '13px', color: '#666' } },
							value ? 'Selected: ' + (selectedLabel || value) : 'No icon selected')
					);
				}

				function IconPreview(props) {
					if (!props.value) return e('span', null);
					return e('span', { className: 'material-symbols-outlined', style: { fontSize: '24px' } }, props.value);
				}

				CMS.registerWidget('icon-select', IconControl, IconPreview);
			})();

			// Slugify helper for auto-generating URL-safe slugs from titles (supports Cyrillic transliteration)
			function slugify(text) {
				if (!text) return '';
				var cyrillicMap = {
					'а':'a','б':'b','в':'v','г':'h','ґ':'g','д':'d','е':'e','є':'ye','ж':'zh','з':'z',
					'и':'y','і':'i','ї':'yi','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p',
					'р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch',
					'ь':'','ю':'yu','я':'ya','ы':'y','э':'e','ё':'yo'
				};
				var str = text.toString().toLowerCase().trim();
				str = str.replace(/[а-яґєіїёыэ]/g, function(ch) {
					return cyrillicMap[ch] !== undefined ? cyrillicMap[ch] : ch;
				});
				return str
					.normalize('NFD')
					.replace(/[\u0300-\u036f]/g, '')
					.replace(/[^a-z0-9]+/g, '-')
					.replace(/^-+|-+$/g, '');
			}

			// Auto-generate hidden category slugs from EN title (persists once created, synced across locales)
			CMS.registerEventListener({
				name: 'preSave',
				handler: function(data) {
					try {
						var entry = data.entry;
						var collection = entry.get ? entry.get('collection') : entry.collection;
						if (collection !== 'equipment-categories') return;

						var entryData = entry.get ? entry.get('data') : entry.data;
						if (!entryData) return;

						var updatedData = entryData;

						// 1. Process EN categories: preserve existing slug if present, otherwise generate from EN title
						var enCats = (updatedData.getIn && updatedData.getIn(['en', 'categories'])) ||
						             (updatedData.get && updatedData.get('categories'));

						if (enCats) {
							enCats.forEach(function(cat, idx) {
								var existingSlug = cat.get ? cat.get('slug') : cat.slug;
								var title = (cat.get ? cat.get('title') : cat.title) || '';
								var slug = existingSlug ? existingSlug.trim() : slugify(title);

								if (slug && updatedData.setIn) {
									if (updatedData.hasIn && updatedData.hasIn(['en', 'categories'])) {
										updatedData = updatedData.setIn(['en', 'categories', idx, 'slug'], slug);
									}
									if (updatedData.has && updatedData.has('categories')) {
										updatedData = updatedData.setIn(['categories', idx, 'slug'], slug);
									}
								}
							});
						}

						// 2. Sync the exact same slug to UA categories
						var uaCats = updatedData.getIn && updatedData.getIn(['ua', 'categories']);
						if (uaCats) {
							var finalEnCats = (updatedData.getIn && updatedData.getIn(['en', 'categories'])) ||
							                  (updatedData.get && updatedData.get('categories'));

							uaCats.forEach(function(cat, idx) {
								var enCat = finalEnCats ? (finalEnCats.get ? finalEnCats.get(idx) : finalEnCats[idx]) : null;
								var enSlug = enCat ? (enCat.get ? enCat.get('slug') : enCat.slug) : '';
								var existingSlug = cat.get ? cat.get('slug') : cat.slug;
								var title = (cat.get ? cat.get('title') : cat.title) || '';
								var slug = enSlug || (existingSlug ? existingSlug.trim() : slugify(title));

								if (slug && updatedData.setIn) {
									updatedData = updatedData.setIn(['ua', 'categories', idx, 'slug'], slug);
								}
							});
						}

						// Return updated data Map directly to Decap CMS
						return updatedData;
					} catch (err) {
						console.error('[preSave] category slug error:', err);
					}
				}
			});

			// Media library lists only top-level files by default; images live in per-product
			// sub-folders (assets/equipment/<product>/), so list the media folder recursively.
			(function() {
				var github = CMS.getBackend('github');
				if (!github) return;
				var originalInit = github.init;
				github.init = function() {
					var backend = originalInit.apply(null, arguments);
					backend.getMedia = function(mediaFolder) {
						var folder = mediaFolder || backend.mediaFolder;
						return backend.api.listFiles(folder, { depth: 100 }).then(function(files) {
							return files.map(function(f) {
								return { id: f.id, name: f.name, size: f.size, displayURL: { id: f.id, path: f.path }, path: f.path };
							});
						});
					};
					return backend;
				};
			})();

			// All widgets registered — now boot Decap
			CMS.init();
		</script>
	</body>
</html>
