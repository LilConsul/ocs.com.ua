backend:
#  name: github
#  repo: LilConsul/ocs.com.ua
#  branch: main
  repo: test-backend
  # For local development: create a Personal Access Token at
  # https://github.com/settings/tokens (classic token with 'repo' scope)
  # Then add to URL: http://localhost:4321/admin/#access_token=YOUR_TOKEN

media_folder: "application/frontend/public/assets/equipment"
public_folder: "/assets/equipment"

# Native i18n configuration
i18n:
  structure: multiple_files  # Creates hc-a.en.md and hc-a.ua.md
  locales: [en, ua]
  default_locale: en

collections:
  # Single equipment collection with nested folder support
  - name: "equipment"
    label: "Equipment"
    folder: "application/frontend/src/content/equipment"
    create: true
    # Nested folders configuration
    nested:
      depth: 100
      summary: "{{dirname}}/{{filename}}"
    meta:
      path:
        widget: "string"
        label: "Path"
        index_file: "index"
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    i18n: true
    fields:
      # Category selector - determines folder structure
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Checkweighers", value: "checkweighers" }
          - { label: "Catchweighers", value: "catchweighers" }
          - { label: "Metal Detectors", value: "metal-detectors" }
          - { label: "X-Ray Inspection", value: "x-ray-inspection" }
        i18n: duplicate

      # Product fields (for equipment items)
      - { label: "Title", name: "title", widget: "string", required: false, i18n: true }
      - { label: "Description", name: "description", widget: "text", i18n: true }
      - { label: "Order", name: "order", widget: "number", default: 0, value_type: "int", i18n: duplicate }

      # Category fields (for index.md files)
      - { label: "Label", name: "label", widget: "string", required: false, i18n: true }
      - { label: "Icon", name: "icon", widget: "string", required: false, i18n: duplicate }

      # Shared fields
      - { label: "Industries", name: "industries", widget: "list", required: false, i18n: true }
      - { label: "Gallery", name: "gallery", widget: "list", required: false, i18n: true }
      - { label: "Datasheet", name: "datasheet", widget: "file", required: false, i18n: duplicate }

      # Specifications - manually editable list
      - label: "Specifications"
        name: "specs"
        widget: "list"
        required: false
        i18n: true
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Value", name: "value", widget: "string" }

      # Body content
      - { label: "Body", name: "body", widget: "markdown", required: false, i18n: true }
