<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft neutral background -->
  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- Subtle circular icon backdrop -->
  <circle cx="400" cy="300" r="110" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Minimalist Image / Photo Icon -->
  <g transform="translate(340, 240)">
    <!-- Outer photo frame -->
    <rect x="0" y="0" width="120" height="120" rx="20" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sun / Aperture in brand accent -->
    <circle cx="40" cy="40" r="11" fill="#c6005c"/>

    <!-- Stylized mountains / waves inside photo -->
    <path d="M 7 98 L 44 56 C 48 51 56 51 60 56 L 113 113" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 62 90 L 78 72 C 82 67 90 67 94 72 L 113 92" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
